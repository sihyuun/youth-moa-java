# 테스트 기본값: 모든 JUnit 테스트에 자동 적용됨 (main application.yml 동일 키를 override).
#
# 배경 (chore/flyway-activation, 2026-07-22):
#   main yml default 가 flyway.enabled=true + ddl-auto=validate 로 반전됨.
#   @DataJpaTest·@SpringBootTest(profile="e2e") 는 H2 를 쓰지만 V1__baseline.sql 은 PostgreSQL dialect 라
#   H2 에서 실행 불가. 따라서 테스트는 flyway off + Hibernate DDL 로 폴백해야 함.
#
# Testcontainers 경로 (YouthMoaApplicationTests) 는 클래스에서 @SpringBootTest(properties = {...}) 로
# 다시 flyway=true + validate 를 opt-in 해서 V1 을 실전 검증한다.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# chore-observability: 테스트에서는 management server 를 비활성화.
# - main yml 은 management.server.port=9091 (별도 서블릿 컨테이너) 로 설정됨.
# - 이 값이 테스트에 상속되면 별도 management ApplicationContext 가 생성되어
#   render 통합 테스트에서 Thymeleaf 리졸버 미상속 → template not found.
# - -1 = "management server 비활성화" (main context 만 존재). Actuator 자체 회귀 테스트가 필요하면
#   그 클래스만 @SpringBootTest(properties="management.server.port=0") 로 opt-in.
management.server.port=-1
