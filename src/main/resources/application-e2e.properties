# Spring profile 'e2e' — CI Playwright 용
# 프로덕션 Supabase 접속 불필요. H2 in-memory 로 격리 부팅.
# `./gradlew bootRun --args='--spring.profiles.active=e2e'`

spring.datasource.url=jdbc:h2:mem:e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 데모 시드 활성화 (DataInitializer 참조)
app.seed.enabled=true

# H2 콘솔 비활성화 (CI 는 UI 접근 없음)
spring.h2.console.enabled=false

# 로그 축소 — 실패 원인 파악용 WARN 이상만
logging.level.root=WARN
logging.level.io.github.sihyuuun.youthmoa=INFO
logging.level.org.springframework.web=INFO
