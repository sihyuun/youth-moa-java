<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Notification panel fragment — prototype.tsx NotifPanel (line 289~337) 기준.
  - 너비 380, radius 14, shadow-lg
  - 헤더: "알림" + unread count 뱃지 (숫자) + "모두 읽음" 링크
  - 항목: 좌 원형 아이콘 (tone) + 제목/본문/시간
  - 하단: "알림 전체보기" → /notifications
  OOB swap: 응답에 header-bell-dot 를 hx-swap-oob 로 포함해 헤더 dot 도 동시 갱신.
-->

<!-- 2026-08-13: id 제거. 헤더 wrapper 가 id="header-notif-dropdown" 를 소유하고 있어 중복 id 문제 발생.
     HTMX outerHTML swap 이 wrapper 를 덮어써 헤더 레이아웃이 깨지던 버그 조치. -->
<div th:fragment="panel"
     class="notif-panel">

    <div class="notif-panel-head">
        <div class="notif-panel-title">
            <span>알림</span>
            <!-- 항상 렌더 (id 안정) — count=0 이면 hidden 속성으로 숨김. OOB 대상. -->
            <span id="notif-panel-badge"
                  th:with="visible=${headerUnreadCount > 0}"
                  th:hidden="${!visible}"
                  class="notif-panel-badge"
                  th:text="${headerUnreadCount}">0</span>
        </div>
        <div class="notif-panel-actions">
            <form th:action="@{/notifications/read-all}"
                  method="post"
                  hx-post="/notifications/read-all"
                  hx-target="#header-notif-dropdown"
                  hx-swap="innerHTML"
                  class="notif-inline-form">
                <button type="submit" class="notif-linklike">모두 읽음</button>
            </form>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(headerRecentNotifications)}" class="notif-empty">
        <span class="notif-empty-text">아직 도착한 알림이 없어요</span>
    </div>

    <div th:each="n : ${headerRecentNotifications}"
         th:classappend="${!n.read} ? ' is-unread' : ''"
         class="notif-item">
        <div th:class="'notif-icon notif-icon--' + ${n.type.toneColor}"
             th:classappend="${!n.read} ? ' is-unread' : ''"
             aria-hidden="true">
            <!-- proto L349: 원형 아이콘 안에 lucide SVG 16 (알림 유형 구분). fragment 이름은 NotificationType.getIconName() -->
            <svg th:switch="${n.type.iconName}"
                 width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <g th:case="'check'">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9 12l2 2 4-4"/>
                </g>
                <g th:case="'calendar'">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M16 2v4M8 2v4M3 10h18"/>
                </g>
                <g th:case="'bell'">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
                </g>
                <g th:case="'close'">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </g>
            </svg>
        </div>
        <!-- 클릭 시 read 처리 (2026-08-13) — hx-post 로 서버에 읽음 통지, 응답 OOB 로 뱃지/dot 즉시 갱신 + HX-Redirect 로 link 이동 -->
        <a th:href="${n.link != null} ? ${n.link} : '/notifications'"
           th:hx-post="@{/notifications/{id}/read(id=${n.id})}"
           hx-swap="none"
           class="notif-item-body">
            <div class="notif-item-title" th:text="${n.title}">제목</div>
            <div class="notif-item-message" th:text="${n.message}">본문</div>
            <div class="notif-item-time"
                 th:text="${#temporals.format(n.createdAt, 'MM.dd HH:mm')}">07.06 12:00</div>
        </a>
        <!--
          prototype L356 close(X) — 헤더 팝업 개별 삭제 (2026-08-13 추가).
          /notifications/{id}/delete API 재사용. hx-swap="delete" 로 이 .notif-item 만 제거.
          badge/dot 갱신은 다음 팝업 오픈 시 동기화 (즉시 갱신은 향후 OOB 확장).
        -->
        <button type="button" class="notif-item-close"
                th:hx-post="@{/notifications/{id}/delete(id=${n.id})}"
                hx-target="closest .notif-item"
                hx-swap="delete"
                aria-label="알림 삭제">
            <svg th:replace="~{fragments/icons :: close(14, 'currentColor')}"></svg>
        </button>
    </div>

    <a th:href="@{/notifications}" class="notif-panel-footer">알림 전체보기</a>

    <!-- OOB swap: 헤더 종 dot 동시 갱신. hx-swap-oob="outerHTML" 로 id 기준 교체. -->
    <span id="header-bell-dot"
          hx-swap-oob="outerHTML"
          th:if="${headerUnreadCount > 0}"
          class="header-bell-dot"
          aria-hidden="true"></span>
    <span id="header-bell-dot"
          hx-swap-oob="outerHTML"
          th:unless="${headerUnreadCount > 0}"
          class="header-bell-dot header-bell-dot--hidden"
          aria-hidden="true"></span>
</div>

</body>
</html>
