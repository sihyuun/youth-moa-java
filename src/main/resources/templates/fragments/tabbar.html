<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  260821 P1(M3): 모바일 하단 탭바.
  - 데스크톱은 CSS 로 display:none.
  - 노출 범위: 루트 4화면 (/, /programs, /centers, /mypage). currentTab 이 null 이면 include 자체를 skip (M7).
  - active 판정: LayoutAdvice 가 URL prefix 매칭해 currentTab 세팅.
-->
<nav th:fragment="tabbar(active)" th:if="${active != null}"
     class="site-tabbar" aria-label="주요 화면 이동">
    <a th:href="@{/}"
       th:classappend="${active == 'home'} ? ' active'"
       class="site-tabbar-item"
       th:attr="aria-current=${active == 'home'} ? 'page' : null">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 4l9 6.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>
        </svg>
        <span>홈</span>
    </a>
    <a th:href="@{/programs}"
       th:classappend="${active == 'programs'} ? ' active'"
       class="site-tabbar-item"
       th:attr="aria-current=${active == 'programs'} ? 'page' : null">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>프로그램</span>
    </a>
    <a th:href="@{/centers}"
       th:classappend="${active == 'centers'} ? ' active'"
       class="site-tabbar-item"
       th:attr="aria-current=${active == 'centers'} ? 'page' : null">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
            <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>청년센터</span>
    </a>
    <a th:href="@{/mypage}"
       th:classappend="${active == 'mypage'} ? ' active'"
       class="site-tabbar-item"
       th:attr="aria-current=${active == 'mypage'} ? 'page' : null">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>마이</span>
    </a>
</nav>

</body>
</html>
