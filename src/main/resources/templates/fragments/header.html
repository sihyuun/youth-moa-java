<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  Header fragment — prototype Header (line 337~400) 기준.
  - 좌: 로고 (img 34px + "청년모아" text)
  - 중앙: nav 3개 (gap:36) — 프로그램 / 청년센터 / 공지사항
  - 우: 검색 아이콘 + (인증) 아바타(이니셜 30px) + 이름 + ▾ 드롭다운
                  (비인증) 로그인 아이콘 1개
  transparent 모드 (F2c): currentPage=='home' 일 때만 `site-header--transparent` 클래스 부착.
  스크롤 60px 넘으면 header-scroll.js 가 `is-scrolled` 클래스를 body 에 추가 → 백색으로 전환.
-->

<header th:fragment="header(currentPage)"
        th:class="${currentPage == 'home'} ? 'site-header site-header--transparent' : 'site-header'">
    <div class="header-inner">

        <!-- Logo (좌, flex:1) -->
        <div class="header-logo-wrap">
            <a th:href="@{/}" class="header-logo">
                <img th:src="@{/images/logo_symbol.png}" alt="" class="header-logo-img">
                <span class="header-logo-text">청년모아</span>
            </a>
        </div>

        <!-- Nav (중앙) -->
        <nav class="header-nav">
            <a th:href="@{/programs}"
               th:class="${currentPage == 'programs'} ? 'nav-link active' : 'nav-link'">프로그램</a>
            <a th:href="@{/centers}"
               th:class="${currentPage == 'centers'} ? 'nav-link active' : 'nav-link'">청년센터</a>
            <a th:href="@{/notices}"
               th:class="${currentPage == 'notices'} ? 'nav-link active' : 'nav-link'">공지사항</a>
        </nav>

        <!-- Right actions (우, flex:1) -->
        <div class="header-right">
            <!-- 검색 아이콘 (공통) — /search 통합 검색 페이지 -->
            <a th:href="@{/search}" class="header-icon-btn" title="검색" aria-label="검색">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35" stroke-linecap="round"/>
                </svg>
            </a>

            <!-- 인증 상태: 알림 종 — U-COMMON-02 (§4-S.3 D1). click 토글 (hover 폐지). -->
            <div sec:authorize="isAuthenticated()" class="header-bell-menu">
                <button type="button"
                        class="header-icon-btn header-bell-trigger"
                        data-dropdown-trigger="header-notif-dropdown"
                        aria-haspopup="menu"
                        aria-controls="header-notif-dropdown"
                        aria-expanded="false"
                        aria-label="알림">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                         stroke="currentColor" stroke-width="1.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 01-3.46 0"/>
                    </svg>
                    <!-- 260821 F1(M6): 모바일에서는 뱃지에 안읽음 개수 표기 (1-9/10-99/99+). 데스크톱은 CSS 로 숫자 숨기고 dot 만 노출. -->
                    <span id="header-bell-dot"
                          th:if="${headerUnreadCount > 0}"
                          class="header-bell-dot"
                          th:text="${headerUnreadCount > 99 ? '99+' : headerUnreadCount}"
                          aria-hidden="true">3</span>
                    <span id="header-bell-dot"
                          th:unless="${headerUnreadCount > 0}"
                          class="header-bell-dot header-bell-dot--hidden"
                          aria-hidden="true"></span>
                </button>
                <div id="header-notif-dropdown" class="header-bell-dropdown-wrap" role="menu" hidden>
                    <div th:replace="~{fragments/notification-panel :: panel}"></div>
                </div>
            </div>

            <!-- 인증 상태: 아바타 + 이름 + ▾ 드롭다운 (U-COMMON-02 D2 A안). -->
            <div sec:authorize="isAuthenticated()" class="header-user-menu">
                <button type="button"
                        class="header-user-trigger"
                        data-dropdown-trigger="header-user-dropdown"
                        aria-haspopup="menu"
                        aria-controls="header-user-dropdown"
                        aria-expanded="false">
                    <span class="header-avatar" aria-hidden="true"
                          th:text="${#strings.substring(#authentication.principal.displayName, 0, 1)}">박</span>
                    <!--/*
                      Thymeleaf 파서 전용 주석 (응답에서 제거됨). sec:authentication element 태그는
                      Spring Security 7 + thymeleaf-extras-springsecurity6 조합에서 리터럴 렌더됨 →
                      #authentication 유틸리티 객체로 대체. 상세는 CLAUDE.md Thymeleaf 규칙 섹션 참조.
                    */-->
                    <span class="header-user-name"
                          th:text="|${#authentication.principal.displayName}님|">이름님</span>
                    <!-- chevron-down SVG (▾ 문자 대체) -->
                    <svg class="header-chev" viewBox="0 0 24 24" width="14" height="14"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <!--
                  D2 A안: [프로필 카드 (아바타 + 이름 + 이메일 · 클릭 시 /mypage)] + 구분선 + [로그아웃].
                  hidden 속성 초기 세팅. window.Dropdown 이 클릭 시 removeAttribute('hidden') + .is-open + .dropdown-enter.
                -->
                <div id="header-user-dropdown" class="header-user-dropdown" role="menu" hidden>
                    <!--
                      A1 admin-shell (2026-09-03): 관리자 계정에게만 "관리자 페이지" 링크 노출.
                      sec:authorize 로 USER 계정은 마크업 자체가 렌더되지 않음.
                    -->
                    <a sec:authorize="hasAnyRole('CENTER_ADMIN','SYSTEM_ADMIN')"
                       th:href="@{/admin}" class="header-dropdown-item" role="menuitem">
                        <svg class="header-dropdown-item-icon" viewBox="0 0 24 24" width="17" height="17"
                             fill="none" stroke="currentColor" stroke-width="1.5"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16l-5.5 3.5 1-6.3L3 8.9 9 8z"/>
                        </svg>
                        <span>관리자 페이지</span>
                    </a>
                    <a th:href="@{/mypage}" class="header-dropdown-profile" role="menuitem">
                        <span class="header-dropdown-profile-avatar" aria-hidden="true"
                              th:text="${#strings.substring(#authentication.principal.displayName, 0, 1)}">박</span>
                        <span class="header-dropdown-profile-info">
                            <span class="header-dropdown-profile-name"
                                  th:text="|${#authentication.principal.displayName}님|">이름님</span>
                            <span class="header-dropdown-profile-email"
                                  th:text="${#authentication.principal.email}">email@example.com</span>
                        </span>
                        <!-- prototype Icon n="chevR" size=15 textTri — 마이페이지 이동 힌트 -->
                        <svg class="header-dropdown-profile-chev" viewBox="0 0 24 24" width="15" height="15"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>
                    <form th:action="@{/logout}" method="post" class="header-dropdown-logout">
                        <button type="submit" class="header-dropdown-item" role="menuitem">
                            <!-- prototype Icon n="login" scaleX(-1) — exit(나가기) 화살표 -->
                            <svg class="header-dropdown-item-icon" viewBox="0 0 24 24" width="17" height="17"
                                 fill="none" stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                                 style="transform:scaleX(-1)">
                                <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                            </svg>
                            <span>로그아웃</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- 비인증 상태: 로그인 아이콘 1개 (회원가입은 로그인 페이지의 secondary 버튼 통해 진입) -->
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}"
               class="header-icon-btn header-icon-btn--primary" title="로그인" aria-label="로그인">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                </svg>
            </a>

            <!-- 260821 P1(M1): 모바일 전체 메뉴 햄버거. 데스크톱은 CSS 로 display:none. -->
            <button type="button" class="header-menu-btn"
                    aria-label="전체 메뉴" aria-expanded="false" aria-controls="site-drawer">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round">
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
            </button>
        </div>

    </div>
</header>

</body>
</html>
