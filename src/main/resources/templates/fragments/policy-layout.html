<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  법적 문서 공통 레이아웃 fragment (HANDOFF.md L629~L652 정합)
  ─────────────────────────────────────────────────────────
  wireframe: 좌측 사이드바(220px, "법적 문서" 섹션) + 우측 본문
  모바일: 사이드바 대신 상단 타이틀 헤더, 본문 아래 관련 문서 링크

  사용 예:
    <div th:replace="~{fragments/policy-layout :: nav('privacy')}"></div>
    <div th:replace="~{fragments/policy-layout :: mobileRelated('privacy')}"></div>
-->
<body>

<!-- 데스크톱 사이드바 nav — active 파라미터로 현재 페이지 강조.
     fragment 이름을 sidebar 로 사용 (nav 이름은 <nav> HTML 태그와 이름 충돌해 selector `:: nav(x)`
     가 fragment 와 <nav> 태그를 모두 매치하는 이슈 회피 — 260819). -->
<aside th:fragment="sidebar(active)" class="policy-sidebar">
    <div class="policy-sidebar-label">법적 문서</div>
    <ul class="policy-nav">
        <li>
            <a th:href="@{/privacy}" class="policy-nav-item"
               th:classappend="${active == 'privacy'} ? ' is-active'">개인정보처리방침</a>
        </li>
        <li>
            <a th:href="@{/terms}" class="policy-nav-item"
               th:classappend="${active == 'terms'} ? ' is-active'">이용약관</a>
        </li>
        <li>
            <a th:href="@{/email-policy}" class="policy-nav-item"
               th:classappend="${active == 'email-policy'} ? ' is-active'">이메일 무단 수집거부</a>
        </li>
    </ul>
</aside>

<!-- 모바일 하단 관련 문서 링크 — 현재 페이지를 제외한 나머지 2개 -->
<nav th:fragment="mobileRelated(active)" class="policy-mobile-related">
    <div class="policy-mobile-related-label">관련 문서</div>
    <div class="policy-mobile-related-links">
        <a th:if="${active != 'privacy'}" th:href="@{/privacy}" class="policy-mobile-related-link">개인정보처리방침</a>
        <a th:if="${active != 'terms'}" th:href="@{/terms}" class="policy-mobile-related-link">이용약관</a>
        <a th:if="${active != 'email-policy'}" th:href="@{/email-policy}" class="policy-mobile-related-link">이메일 무단 수집거부</a>
    </div>
</nav>

</body>
</html>
