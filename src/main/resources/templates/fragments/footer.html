<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  footer fragment: U-COMMON-01 부터 toast-stack + common-ui.js 를 함께 포함.
  th:fragment 는 요소 1개만 가능하므로 <th:block> 으로 감싸 3개 노드 방출.
-->
<th:block th:fragment="footer">
<footer class="site-footer">
    <div class="footer-inner">
        <a th:href="@{/}" class="footer-logo">
            <img th:src="@{/images/logo_symbol.png}" alt="" class="footer-logo-img">
            <span class="footer-logo-text">청년모아</span>
        </a>
        <div class="footer-center">
            <div class="footer-links">
                <a href="#">개인정보처리방침</a>
                <a href="#">이용약관</a>
                <a href="#">이메일주소무단수집거부</a>
            </div>
            <!-- 연도 동적화 — current year 자동 -->
            <p class="footer-copy">
                Copyright &copy; <span th:text="${T(java.time.Year).now().getValue()}">2025</span> 청년모아 All Rights Reserved
            </p>
        </div>
        <div class="footer-sns">
            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img th:src="@{/images/sns_instagram.png}" alt="Instagram"></a>
            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><img th:src="@{/images/sns_youtube.png}" alt="YouTube"></a>
            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="KakaoTalk"><img th:src="@{/images/sns_kakaotalk.png}" alt="KakaoTalk"></a>
            <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img th:src="@{/images/sns_facebook.png}" alt="Facebook"></a>
        </div>
    </div>
</footer>

<!-- U-COMMON-01 공통 UI: Toast 컨테이너 + Modal/Toast JS API -->
<div class="toast-stack" aria-live="polite" aria-atomic="false"></div>
<script th:src="@{/js/common-ui.js}" defer></script>
</th:block>

</body>
</html>
