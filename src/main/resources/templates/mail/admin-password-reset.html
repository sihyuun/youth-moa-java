<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|${serviceName} 임시 비밀번호가 재발급되었어요|">임시 비밀번호 재발급 안내</title>
</head>
<body style="margin:0;padding:0;background:#F5F5F7;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#2B2A3D;">

<!--
  A7 admin-invitation-mail (2026-09-30) — 임시 비밀번호 재발급 메일.
  admin-invitation.html 과 동일한 인라인 스타일 · 구조. 문구만 "재발급" 관점으로 변경.
-->

<div style="max-width:600px;margin:0 auto;padding:32px 24px;background:#FFFFFF;">

    <div style="text-align:center;padding:16px 0 32px 0;border-bottom:1px solid #E3E1E8;">
        <h1 style="margin:0;font-size:28px;font-weight:700;color:#3F30E9;letter-spacing:-0.5px;"
            th:text="${serviceName}">청년몽땅</h1>
    </div>

    <div style="padding:32px 0 8px 0;">
        <p style="margin:0;font-size:18px;font-weight:600;color:#2B2A3D;">
            안녕하세요, <span th:text="${name}">회원</span>님
        </p>
    </div>

    <div style="padding:8px 0 24px 0;">
        <p style="margin:0;font-size:15px;line-height:1.6;color:#4B5563;">
            관리자가 요청하신 계정의 <strong>임시 비밀번호를 재발급</strong>했습니다.<br>
            아래 임시 비밀번호로 로그인 후 <strong style="color:#EF4444;">반드시 새 비밀번호로 변경</strong>해주세요.
        </p>
    </div>

    <div style="padding:20px;background:#F5F5FF;border:1px solid #E3E1E8;border-radius:8px;margin-bottom:24px;">
        <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
            <tr>
                <td style="padding:6px 0;color:#6E6B82;width:120px;">이메일</td>
                <td style="padding:6px 0;color:#2B2A3D;font-weight:600;" th:text="${email}">
                    user@example.com
                </td>
            </tr>
            <tr>
                <td style="padding:6px 0;color:#6E6B82;">임시 비밀번호</td>
                <td style="padding:6px 0;">
                    <span style="display:inline-block;padding:4px 10px;background:#FFFFFF;border:1px solid #E3E1E8;border-radius:4px;font-family:'Menlo','Consolas',monospace;font-size:14px;font-weight:700;color:#3F30E9;letter-spacing:0.5px;"
                          th:text="${tempPassword}">Abcd1234!@#$</span>
                </td>
            </tr>
        </table>
    </div>

    <div style="text-align:center;padding:8px 0 32px 0;">
        <a th:href="${loginUrl}"
           style="display:inline-block;padding:14px 32px;background:#3F30E9;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;border-radius:8px;">
            로그인 하러 가기
        </a>
    </div>

    <div style="padding:16px 20px;background:#FEF3C7;border-radius:8px;margin-bottom:24px;">
        <p style="margin:0;font-size:13px;line-height:1.5;color:#92400E;">
            <strong>본인이 요청한 재발급이 아닌가요?</strong><br>
            즉시 담당 관리자에게 문의해주세요. 기존 비밀번호는 이 재발급으로 무효화되었습니다.
        </p>
    </div>

    <div style="padding:24px 0 0 0;border-top:1px solid #E3E1E8;text-align:center;">
        <p style="margin:0 0 6px 0;font-size:12px;color:#6E6B82;">
            본 메일은 발신 전용입니다. 문의사항은 담당 관리자에게 연락해주세요.
        </p>
        <p style="margin:0;font-size:11px;color:#9CA3AF;"
           th:text="|© ${serviceName}|">© 청년몽땅</p>
    </div>

</div>

</body>
</html>
