<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 — 개인정보 수정 · 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header('mypage')}"></div>

<main class="mypage-page">
    <div class="container">
        <div th:replace="~{mypage/layout :: head}"></div>

        <section class="mypage-profile-edit">
            <h3 class="mypage-section-title">개인정보 수정</h3>

            <form th:action="@{/mypage/profile}" th:object="${profileUpdateRequest}"
                  method="post" class="mypage-edit-form" novalidate>

                <div class="mypage-edit-field">
                    <label for="editName">이름</label>
                    <input id="editName" type="text" th:field="*{name}" class="auth-input" required>
                    <p class="auth-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="mypage-edit-field">
                    <label for="editPhone">핸드폰</label>
                    <input id="editPhone" type="tel" th:field="*{phone}" class="auth-input"
                           placeholder="010-1234-5678">
                    <p class="auth-field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>

                <div class="mypage-edit-field">
                    <label for="editZipcode">우편번호</label>
                    <input id="editZipcode" type="text" th:field="*{zipcode}" class="auth-input">
                </div>

                <div class="mypage-edit-field">
                    <label for="editAddress">주소</label>
                    <input id="editAddress" type="text" th:field="*{address}" class="auth-input">
                </div>

                <div class="mypage-edit-field">
                    <label for="editAddressDetail">상세주소</label>
                    <input id="editAddressDetail" type="text" th:field="*{addressDetail}" class="auth-input">
                </div>

                <div class="mypage-edit-field">
                    <label for="editBirthDate">생년월일</label>
                    <input id="editBirthDate" type="date" th:field="*{birthDate}" class="auth-input">
                </div>

                <div class="mypage-edit-actions">
                    <a th:href="@{/mypage(tab='profile')}" class="btn-auth btn-auth--secondary">취소</a>
                    <button type="submit" class="btn-auth btn-auth--primary">저장</button>
                </div>
            </form>

            <div class="mypage-edit-note">
                <p>비밀번호를 변경하려면 <a th:href="@{/find-password}">비밀번호 찾기 페이지</a> 를 이용해 주세요.</p>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
