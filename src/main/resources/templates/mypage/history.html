<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 — 신청내역 · 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header('mypage')}"></div>

<main class="mypage-page">
    <div class="container">
        <div th:replace="~{mypage/layout :: head}"></div>

        <section class="mypage-history mypage-card">
            <h3 class="mypage-section-title">프로그램 신청 내역</h3>
            <p class="mypage-section-subtitle">최대 지난 3년간의 프로그램 신청 내역까지 확인할 수 있어요</p>

            <!-- 기간 필터 (prototype L1407~1411) -->
            <div class="history-period-tabs">
                <a th:href="@{/mypage(tab='history', period='3M', status=${currentStatusFilter})}"
                   th:class="${currentPeriod == '3M'} ? 'history-period-tab is-on' : 'history-period-tab'">3개월</a>
                <a th:href="@{/mypage(tab='history', period='6M', status=${currentStatusFilter})}"
                   th:class="${currentPeriod == '6M'} ? 'history-period-tab is-on' : 'history-period-tab'">6개월</a>
                <a th:href="@{/mypage(tab='history', period='1Y', status=${currentStatusFilter})}"
                   th:class="${currentPeriod == '1Y'} ? 'history-period-tab is-on' : 'history-period-tab'">1년</a>
                <a th:href="@{/mypage(tab='history', period='3Y', status=${currentStatusFilter})}"
                   th:class="${currentPeriod == '3Y'} ? 'history-period-tab is-on' : 'history-period-tab'">3년</a>
            </div>

            <!-- 상태 필터 칩 (prototype L1413~1424) -->
            <div class="history-status-chips">
                <a th:href="@{/mypage(tab='history', period=${currentPeriod}, status='ALL')}"
                   th:class="${currentStatusFilter == 'ALL'} ? 'history-status-chip is-on' : 'history-status-chip'">
                    <span>전체</span><span class="history-status-count" th:text="${countAll}">0</span>
                </a>
                <a th:href="@{/mypage(tab='history', period=${currentPeriod}, status='APPROVED')}"
                   th:class="${currentStatusFilter == 'APPROVED'} ? 'history-status-chip is-on' : 'history-status-chip'">
                    <span>승인</span><span class="history-status-count" th:text="${countApproved}">0</span>
                </a>
                <a th:href="@{/mypage(tab='history', period=${currentPeriod}, status='PENDING')}"
                   th:class="${currentStatusFilter == 'PENDING'} ? 'history-status-chip is-on' : 'history-status-chip'">
                    <span>대기</span><span class="history-status-count" th:text="${countPending}">0</span>
                </a>
                <a th:href="@{/mypage(tab='history', period=${currentPeriod}, status='REJECTED')}"
                   th:class="${currentStatusFilter == 'REJECTED'} ? 'history-status-chip is-on' : 'history-status-chip'">
                    <span>반려</span><span class="history-status-count" th:text="${countRejected}">0</span>
                </a>
                <a th:href="@{/mypage(tab='history', period=${currentPeriod}, status='CANCELLED')}"
                   th:class="${currentStatusFilter == 'CANCELLED'} ? 'history-status-chip is-on' : 'history-status-chip'">
                    <span>취소</span><span class="history-status-count" th:text="${countCancelled}">0</span>
                </a>
            </div>

            <!-- 빈 상태 -->
            <div th:if="${#lists.isEmpty(applications)}" class="mypage-empty mypage-empty--icon">
                <svg th:replace="~{fragments/icons :: calendar(64, 'var(--color-border)')}"></svg>
                <p th:if="${currentStatusFilter == 'ALL'}">신청한 프로그램이 없습니다.</p>
                <p th:unless="${currentStatusFilter == 'ALL'}">해당 상태의 신청 내역이 없습니다.</p>
                <a th:if="${currentStatusFilter == 'ALL'}"
                   th:href="@{/programs}" class="btn-auth btn-auth--primary">프로그램 보기</a>
            </div>

            <!-- 카드 리스트 -->
            <ul class="mypage-history-list" th:unless="${#lists.isEmpty(applications)}">
                <li th:each="app : ${applications}" class="mypage-history-card">
                    <!-- 상단: 신청일시 + 신청 상세 -->
                    <div class="history-card-head">
                        <span class="history-card-time"
                              th:text="${#temporals.format(app.appliedAt, 'yyyy.MM.dd HH:mm:ss')}">2026.07.05 17:11:31</span>
                        <a th:href="@{/mypage/applications/{id}(id=${app.id})}" class="history-card-detail-link">
                            <span>신청 상세</span>
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>
                        </a>
                    </div>
                    <!-- 본문: 이미지 + 정보 -->
                    <div class="history-card-body">
                        <div class="history-card-thumb">
                            <img th:if="${app.program.imageUrl != null}"
                                 th:src="${app.program.imageUrl}" alt=""/>
                            <div th:if="${app.program.imageUrl == null}" class="history-card-thumb-placeholder"></div>
                        </div>
                        <div class="history-card-info">
                            <a th:href="@{/programs/{id}(id=${app.program.id})}" class="history-card-title-row">
                                <span class="history-card-title" th:text="${app.program.title}">프로그램 제목</span>
                                <span th:class="'history-status-badge history-status-badge--' + ${app.status.name().toLowerCase()}"
                                      th:text="${app.status.name() == 'APPROVED' ? '승인'
                                              : (app.status.name() == 'PENDING' ? '대기'
                                              : (app.status.name() == 'REJECTED' ? '반려' : '취소'))}">승인</span>
                            </a>
                            <div class="history-card-sub">
                                <span th:text="${app.program.organization}">기관</span>
                                <span th:if="${app.program.startDate != null and app.program.endDate != null}"
                                      th:text="' · ' + ${#temporals.format(app.program.startDate, 'yyyy-MM-dd')} + '~' + ${#temporals.format(app.program.endDate, 'yyyy-MM-dd')}"> · 2026-08-01~08-31</span>
                            </div>
                            <div class="history-card-actions">
                                <button th:if="${app.status.name() == 'PENDING' or app.status.name() == 'APPROVED'}"
                                        type="button"
                                        class="btn-outline btn-outline--sm btn-outline--danger"
                                        th:attr="data-app-id=${app.id},data-app-title=${app.program.title}"
                                        onclick="openCancelModal(this)">신청 취소</button>
                                <a th:if="${app.status.name() == 'REJECTED' or app.status.name() == 'CANCELLED'}"
                                   th:href="@{/programs/{id}/apply(id=${app.program.id})}"
                                   class="btn-outline btn-outline--sm btn-outline--secondary">재신청</a>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </section>
    </div>
</main>

<!-- 취소 모달 (U-COMMON-01 공통 .modal-card 셸로 마이그레이션) -->
<div id="cancelModal" class="modal-backdrop" aria-hidden="true" hidden>
    <div class="modal-card modal-card--sm" role="dialog" aria-modal="true" aria-labelledby="cancelModalHeading">
        <div class="modal-card__header">
            <h3 class="modal-card__title" id="cancelModalHeading">신청을 취소하시겠어요?</h3>
            <button type="button" class="modal-card__close" aria-label="닫기" data-modal-close onclick="closeCancelModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="modal-card__body">
            <p class="modal-card__message" id="cancelModalTitle"></p>
            <form th:action="@{/mypage/applications/__/cancel}" method="post" id="cancelForm">
                <fieldset class="mypage-reason-list">
                    <legend class="visually-hidden">취소 사유</legend>
                    <label><input type="radio" name="reasonCode" value="CHANGE_MIND" required> 단순 변심</label>
                    <label><input type="radio" name="reasonCode" value="SCHEDULE_CONFLICT"> 일정이 맞지 않음</label>
                    <label><input type="radio" name="reasonCode" value="DUPLICATE_APPLY"> 중복 신청</label>
                    <label><input type="radio" name="reasonCode" value="PERSONAL"> 개인 사유</label>
                    <label><input type="radio" name="reasonCode" value="OTHER" id="reasonOther"> 기타</label>
                </fieldset>
                <textarea name="reasonText" id="reasonText" maxlength="100"
                          placeholder="기타 사유 (최대 100자)" hidden></textarea>
                <div class="modal-card__footer">
                    <button type="button" onclick="closeCancelModal()" class="btn-auth btn-auth--secondary">닫기</button>
                    <button type="submit" class="btn-auth btn-auth--danger">확인</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    let currentAppId = null;
    function openCancelModal(btn) {
        currentAppId = btn.dataset.appId;
        document.getElementById('cancelModalTitle').textContent = btn.dataset.appTitle;
        const form = document.getElementById('cancelForm');
        form.action = '/mypage/applications/' + currentAppId + '/cancel';
        // 공통 Modal API 사용 (focus trap · ESC · backdrop 자동 처리)
        if (window.Modal) { window.Modal.open('cancelModal'); }
        else { document.getElementById('cancelModal').hidden = false; }
    }
    function closeCancelModal() {
        if (window.Modal) { window.Modal.close('cancelModal'); }
        else { document.getElementById('cancelModal').hidden = true; }
    }
    document.querySelectorAll('input[name="reasonCode"]').forEach(radio => {
        radio.addEventListener('change', e => {
            const ta = document.getElementById('reasonText');
            const isOther = e.target.value === 'OTHER';
            ta.hidden = !isOther;
            ta.required = isOther;
        });
    });
</script>

</body>
</html>
