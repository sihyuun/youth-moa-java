<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 — 신청내역 · 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header('mypage')}"></div>

<main class="mypage-page">
    <div class="container">
        <div th:replace="~{mypage/layout :: head}"></div>

        <section class="mypage-history">
            <h3 class="mypage-section-title">프로그램 신청 내역</h3>
            <p class="mypage-section-subtitle">최대 지난 3년간의 신청 내역을 확인할 수 있어요.</p>

            <div th:if="${#lists.isEmpty(applications)}" class="mypage-empty">
                <p>아직 신청한 프로그램이 없어요.</p>
                <a th:href="@{/programs}" class="btn-auth btn-auth--primary">프로그램 둘러보기</a>
            </div>

            <ul class="mypage-history-list" th:unless="${#lists.isEmpty(applications)}">
                <li th:each="app : ${applications}" class="mypage-history-card">
                    <div class="mypage-history-meta">
                        <span class="mypage-history-date"
                              th:text="${#temporals.format(app.appliedAt, 'yyyy.MM.dd')}">2024.01.01</span>
                        <span th:class="'category-badge status-' + ${app.status.name().toLowerCase()}"
                              th:text="${app.status.name()}">PENDING</span>
                    </div>
                    <a th:href="@{/programs/{id}(id=${app.program.id})}" class="mypage-history-title"
                       th:text="${app.program.title}">프로그램 제목</a>
                    <div class="mypage-history-actions">
                        <button th:if="${app.status.name() == 'PENDING' or app.status.name() == 'APPROVED'}"
                                type="button"
                                class="mypage-cancel-btn"
                                th:attr="data-app-id=${app.id},data-app-title=${app.program.title}"
                                onclick="openCancelModal(this)">취소</button>
                        <a th:if="${app.status.name() == 'REJECTED' or app.status.name() == 'CANCELLED'}"
                           th:href="@{/programs/{id}/apply(id=${app.program.id})}"
                           class="mypage-reapply-link">재신청</a>
                    </div>
                </li>
            </ul>
        </section>
    </div>
</main>

<!-- 취소 모달 (U-COMMON-01 공통 .modal-card 셸로 마이그레이션) -->
<div id="cancelModal" class="modal-backdrop" aria-hidden="true" hidden>
    <div class="modal-card modal-card--sm" role="dialog" aria-modal="true" aria-labelledby="cancelModalHeading">
        <div class="modal-card__header">
            <h3 class="modal-card__title" id="cancelModalHeading">신청을 취소하시겠어요?</h3>
            <button type="button" class="modal-card__close" aria-label="닫기" data-modal-close onclick="closeCancelModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="modal-card__body">
            <p class="modal-card__message" id="cancelModalTitle"></p>
            <form th:action="@{/mypage/applications/__/cancel}" method="post" id="cancelForm">
                <fieldset class="mypage-reason-list">
                    <legend class="visually-hidden">취소 사유</legend>
                    <label><input type="radio" name="reasonCode" value="CHANGE_MIND" required> 단순 변심</label>
                    <label><input type="radio" name="reasonCode" value="SCHEDULE_CONFLICT"> 일정이 맞지 않음</label>
                    <label><input type="radio" name="reasonCode" value="DUPLICATE_APPLY"> 중복 신청</label>
                    <label><input type="radio" name="reasonCode" value="PERSONAL"> 개인 사유</label>
                    <label><input type="radio" name="reasonCode" value="OTHER" id="reasonOther"> 기타</label>
                </fieldset>
                <textarea name="reasonText" id="reasonText" maxlength="100"
                          placeholder="기타 사유 (최대 100자)" hidden></textarea>
                <div class="modal-card__footer">
                    <button type="button" onclick="closeCancelModal()" class="btn-auth btn-auth--secondary">닫기</button>
                    <button type="submit" class="btn-auth btn-auth--danger">확인</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    let currentAppId = null;
    function openCancelModal(btn) {
        currentAppId = btn.dataset.appId;
        document.getElementById('cancelModalTitle').textContent = btn.dataset.appTitle;
        const form = document.getElementById('cancelForm');
        form.action = '/mypage/applications/' + currentAppId + '/cancel';
        // 공통 Modal API 사용 (focus trap · ESC · backdrop 자동 처리)
        if (window.Modal) { window.Modal.open('cancelModal'); }
        else { document.getElementById('cancelModal').hidden = false; }
    }
    function closeCancelModal() {
        if (window.Modal) { window.Modal.close('cancelModal'); }
        else { document.getElementById('cancelModal').hidden = true; }
    }
    document.querySelectorAll('input[name="reasonCode"]').forEach(radio => {
        radio.addEventListener('change', e => {
            const ta = document.getElementById('reasonText');
            const isOther = e.target.value === 'OTHER';
            ta.hidden = !isOther;
            ta.required = isOther;
        });
    });
</script>

</body>
</html>
