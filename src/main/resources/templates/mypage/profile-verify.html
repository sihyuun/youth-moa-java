<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 — 개인정보 · 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header('mypage')}"></div>

<main class="mypage-page">
    <div class="container">
        <div th:replace="~{mypage/layout :: head}"></div>

        <section class="mypage-profile-verify">
            <h3 class="mypage-section-title">개인정보 수정</h3>
            <p class="mypage-section-hint">본인 확인을 위해 비밀번호를 다시 입력해 주세요.</p>

            <div th:if="${profileVerifyError}" class="alert alert-error"
                 th:text="${profileVerifyError}"></div>

            <form th:action="@{/mypage/profile/verify}" method="post" class="mypage-verify-form">
                <div class="mypage-verify-field">
                    <label class="visually-hidden" for="verifyEmail">이메일</label>
                    <input id="verifyEmail" type="email" class="auth-input"
                           th:value="${myUser.email}" readonly>
                </div>
                <div class="mypage-verify-field">
                    <label class="visually-hidden" for="verifyPassword">비밀번호</label>
                    <input id="verifyPassword" type="password" name="password" class="auth-input"
                           placeholder="비밀번호" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-auth btn-auth--primary">확인</button>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
