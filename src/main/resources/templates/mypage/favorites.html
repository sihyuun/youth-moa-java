<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 — 즐겨찾기 · 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header('mypage')}"></div>

<main class="mypage-page">
    <div class="container">
        <div th:replace="~{mypage/layout :: head}"></div>

        <section class="mypage-favorites">
            <h3 class="mypage-section-title">즐겨찾기</h3>

            <div th:if="${#lists.isEmpty(bookmarks)}" class="mypage-empty">
                <p>즐겨찾기한 프로그램이 없어요.</p>
                <a th:href="@{/programs}" class="btn-auth btn-auth--primary">프로그램 둘러보기</a>
            </div>

            <ul class="mypage-favorites-list" th:unless="${#lists.isEmpty(bookmarks)}">
                <li th:each="b : ${bookmarks}" class="mypage-favorites-card">
                    <a th:href="@{/programs/{id}(id=${b.program.id})}" class="mypage-favorites-title"
                       th:text="${b.program.title}">프로그램</a>
                    <div class="mypage-favorites-sub">
                        <span th:text="${b.program.organization}">기관</span>
                        <span th:if="${b.program.region != null}"
                              th:text="' · ' + ${b.program.region}"> · 지역</span>
                    </div>
                </li>
            </ul>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
