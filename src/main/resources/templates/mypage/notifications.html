<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 — 알림 설정 · 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header('mypage')}"></div>

<main class="mypage-page">
    <div class="container">
        <div th:replace="~{mypage/layout :: head}"></div>

        <section class="mypage-noti">
            <h3 class="mypage-section-title">알림 채널</h3>
            <p class="mypage-section-hint">알림을 받을 채널을 선택하세요.</p>

            <form th:action="@{/mypage/notifications}" method="post" class="mypage-noti-form">
                <label class="mypage-noti-row">
                    <input type="checkbox" name="notifyKakao" value="true"
                           th:checked="${myUser.notifyKakao}">
                    <span class="mypage-noti-label">카카오 알림톡</span>
                </label>
                <label class="mypage-noti-row">
                    <input type="checkbox" name="notifySms" value="true"
                           th:checked="${myUser.notifySms}">
                    <span class="mypage-noti-label">문자(SMS)</span>
                </label>
                <label class="mypage-noti-row">
                    <input type="checkbox" name="notifyEmail" value="true"
                           th:checked="${myUser.notifyEmail}">
                    <span class="mypage-noti-label">이메일</span>
                </label>
                <label class="mypage-noti-row is-locked">
                    <input type="checkbox" checked disabled>
                    <span class="mypage-noti-label">신청 승인/반려 결과 (필수)</span>
                </label>
                <div class="mypage-noti-actions">
                    <button type="submit" class="btn-auth btn-auth--primary">저장</button>
                </div>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
