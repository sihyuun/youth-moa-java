<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 — 알림 설정 · 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header('mypage')}"></div>

<main class="mypage-page">
    <div class="container">
        <div th:replace="~{mypage/layout :: head}"></div>

        <section class="mypage-noti">
            <h3 class="mypage-section-title">알림 채널</h3>
            <p class="mypage-section-hint">알림을 받을 채널을 선택하세요.</p>

            <div class="mypage-noti-form" id="notiInstantForm">
                <label class="mypage-noti-row">
                    <input type="checkbox" name="kakao" value="true"
                           th:checked="${myUser.notifyKakao}" data-noti-toggle>
                    <span class="mypage-noti-label">카카오 알림톡</span>
                </label>
                <label class="mypage-noti-row">
                    <input type="checkbox" name="sms" value="true"
                           th:checked="${myUser.notifySms}" data-noti-toggle>
                    <span class="mypage-noti-label">문자(SMS)</span>
                </label>
                <label class="mypage-noti-row">
                    <input type="checkbox" name="email" value="true"
                           th:checked="${myUser.notifyEmail}" data-noti-toggle>
                    <span class="mypage-noti-label">이메일</span>
                </label>
                <label class="mypage-noti-row is-locked">
                    <input type="checkbox" checked disabled>
                    <span class="mypage-noti-label">신청 승인/반려 결과 (필수)</span>
                </label>
            </div>

            <p class="mypage-noti-autosave-hint">변경 사항은 자동으로 저장돼요.</p>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/mypage-noti-instant.js}" defer></script>

</body>
</html>
