<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — youth-moa</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header('notices')}"></div>

<main class="main-content">

    <div class="page-title-bar">
        <h2>공지사항</h2>
    </div>

    <div class="container notice-container">
        <!-- 탭 + 목록을 하나의 wrapper 로 감싸 HTMX 부분 갱신 시 탭 active 상태도 함께 재렌더된다. -->
        <div th:replace="~{notice/_list-fragment :: content-region}"></div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
