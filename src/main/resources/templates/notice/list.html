<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 — youth-moa</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header('notices')}"></div>

<main class="main-content">

    <div class="page-title-bar">
        <h2>공지사항</h2>
    </div>

    <div class="container notice-container">

        <!-- 카테고리 pill 탭 (HTMX 부분 갱신) -->
        <div class="notice-tabs">
            <a th:href="@{/notices}"
               th:class="${filterCategory == null} ? 'notice-tab active' : 'notice-tab'"
               hx-get="/notices" hx-target="#notice-list-region" hx-swap="outerHTML"
               hx-push-url="true">전체</a>
            <a th:each="c : ${categories}"
               th:href="@{/notices(category=${c.name()})}"
               th:class="${filterCategory != null and filterCategory.name() == c.name()} ? 'notice-tab active' : 'notice-tab'"
               th:hx-get="@{/notices(category=${c.name()})}"
               hx-target="#notice-list-region" hx-swap="outerHTML" hx-push-url="true"
               th:text="${c.label}">행사</a>
        </div>

        <!-- 부분 갱신 대상 (fragment 자체가 #notice-list-region 을 wrap) -->
        <div th:replace="~{notice/_list-fragment :: list-region}"></div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
