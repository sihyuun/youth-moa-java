<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${center.name} + ' — youth-moa'">청년센터 상세 — youth-moa</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script th:if="${!#strings.isEmpty(kakaoMapAppKey)}"
            th:src="'//dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoMapAppKey} + '&autoload=false'"></script>
    <script th:src="@{/js/center-map.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header('centers')}"></div>

<main class="main-content">
    <div class="container center-detail-container">
        <a th:href="@{/centers}" class="notice-back-btn" title="목록으로" aria-label="목록으로">
            <span>←</span>
        </a>

        <h1 class="center-detail-title" th:text="${center.name}">센터명</h1>
        <div class="center-detail-meta">
            <span th:text="${center.region}">지역</span>
            <span th:if="${center.isActive}" class="center-card-badge active">운영중</span>
            <span th:unless="${center.isActive}" class="center-card-badge inactive">운영종료</span>
        </div>

        <div class="center-detail-info">
            <div><strong>주소</strong> <span th:text="${center.address}">주소</span></div>
            <div th:if="${center.phone != null}"><strong>전화</strong> <span th:text="${center.phone}">전화</span></div>
        </div>

        <!-- 단일 마커 지도 -->
        <div class="centers-map-panel center-detail-map-wrap">
            <div id="center-map"
                 class="center-map-container"
                 th:attr="data-single-lat=${center.latitude},
                          data-single-lng=${center.longitude},
                          data-single-name=${center.name}"></div>
            <div class="map-fallback"
                 th:if="${#strings.isEmpty(kakaoMapAppKey) or center.latitude == null}">
                지도를 표시할 수 없습니다. (좌표 정보 없음 또는 지도 SDK 미설정)
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
