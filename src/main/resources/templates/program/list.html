<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 — youth-moa</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/htmx-csrf.js}" defer></script>
    <!-- F0f-fix-1: 카드 CTA 오픈알림 / 빈자리알림 modal 트리거 (common-ui.js Modal/Toast 재사용) -->
    <script th:src="@{/js/program-list-alerts.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header('programs')}"></div>

<main class="main-content">

    <!-- 페이지 타이틀 -->
    <div class="page-title-bar">
        <h2>프로그램</h2>
    </div>

    <div class="programs-layout container">

        <!-- 사이드바: 지역 + 청년센터 필터 (featured 5 + 전체보기 팝오버) -->
        <aside class="programs-sidebar">

            <!-- 지역 -->
            <h3 class="sidebar-title">지역</h3>
            <ul class="sidebar-list" id="sidebar-region-list">
                <li th:each="r : ${sidebarRegions}" class="sidebar-check-item">
                    <label>
                        <input type="checkbox" name="regions"
                               th:value="${r.name}"
                               th:checked="${filterRegions != null and filterRegions.contains(r.name)}"
                               onchange="onSidebarChange()">
                        <span th:text="${r.name}">지역명</span>
                    </label>
                </li>
            </ul>
            <button type="button" class="sidebar-show-all"
                    onclick="openFilterPopover('regions')">
                전체보기 →
            </button>

            <!-- 청년센터 -->
            <h3 class="sidebar-title" style="margin-top:24px">청년센터</h3>
            <ul class="sidebar-list" id="sidebar-center-list">
                <li th:each="c : ${sidebarCenters}" class="sidebar-check-item">
                    <label>
                        <input type="checkbox" name="centers"
                               th:value="${c.name}"
                               th:checked="${filterCenters != null and filterCenters.contains(c.name)}"
                               onchange="onSidebarChange()">
                        <span th:text="${c.name}">청년센터명</span>
                    </label>
                </li>
            </ul>
            <button type="button" class="sidebar-show-all"
                    onclick="openFilterPopover('centers')">
                전체보기 →
            </button>
        </aside>

        <!-- 메인 컨텐츠 -->
        <section class="programs-main">

            <!-- 상태 탭 + 정렬 + view-toggle -->
            <div class="filter-bar">
                <div class="status-tabs">
                    <a th:href="@{/programs(regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${#strings.isEmpty(filterStatus)} ? 'status-tab active' : 'status-tab'">
                        전체
                    </a>
                    <a th:href="@{/programs(status='active',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${filterStatus == 'active'} ? 'status-tab active' : 'status-tab'">
                        진행중
                    </a>
                    <a th:href="@{/programs(status='upcoming',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${filterStatus == 'upcoming'} ? 'status-tab active' : 'status-tab'">
                        진행예정
                    </a>
                    <a th:href="@{/programs(status='closed',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${filterStatus == 'closed'} ? 'status-tab active' : 'status-tab'">
                        마감
                    </a>
                </div>

                <div class="filter-right">
                    <div class="sort-options">
                        <a th:href="@{/programs(status=${filterStatus},regions=${filterRegions},centers=${filterCenters},sort='newest')}"
                           th:class="${filterSort == 'newest' or #strings.isEmpty(filterSort)} ? 'sort-link active' : 'sort-link'">
                            최신순
                        </a>
                        <span class="sort-sep">·</span>
                        <a th:href="@{/programs(status=${filterStatus},regions=${filterRegions},centers=${filterCenters},sort='deadline')}"
                           th:class="${filterSort == 'deadline'} ? 'sort-link active' : 'sort-link'">
                            마감임박순
                        </a>
                        <span class="sort-sep">·</span>
                        <a th:href="@{/programs(status=${filterStatus},regions=${filterRegions},centers=${filterCenters},sort='popular')}"
                           th:class="${filterSort == 'popular'} ? 'sort-link active' : 'sort-link'">
                            인기순
                        </a>
                    </div>

                    <div class="view-toggle">
                        <button type="button" class="view-toggle-btn active" aria-pressed="true">목록</button>
                        <button type="button" class="view-toggle-btn view-toggle-btn--disabled"
                                title="캘린더 보기는 곧 제공돼요"
                                disabled>캘린더</button>
                    </div>
                </div>
            </div>

            <!-- 부분 갱신 대상 영역 -->
            <div id="program-list-region">
                <div th:replace="~{program/_list-fragment :: list-region}"></div>
            </div>
        </section>
    </div>
</main>

<!-- 팝오버 (지역·청년센터 전체보기) — inline 재작성.
     TODO(F0f-후속): 원래 templates/program/_filter-popover.html fragment call 시도했으나 렌더 도중 응답이
     ERR_INCOMPLETE_CHUNKED_ENCODING 로 끊기는 이슈로 임시 inline 처리. Thymeleaf 3.x fragment call 문법
     (th:onclick="|closeFilterPopover('${group}')|" 안의 SpEL literal + fragment 인자 전달 조합) 원인
     재규명 후 fragment 로 재활용 검토. (지금은 미사용 파일이라 삭제됨) -->
<div class="filter-popover-backdrop" data-group="regions"
     onclick="closeFilterPopover('regions')" style="display:none"></div>
<div class="filter-popover" data-group="regions" style="display:none">
    <div class="filter-popover-header">
        <h4>지역 전체</h4>
        <button type="button" class="filter-popover-close" aria-label="닫기"
                onclick="closeFilterPopover('regions')">×</button>
    </div>
    <input type="text" class="filter-popover-search" placeholder="검색"
           oninput="filterPopoverSearch('regions', this.value)"
           th:if="${allRegions != null and allRegions.size() > 8}">
    <div class="filter-popover-options">
        <label th:each="opt : ${allRegions}">
            <input type="checkbox" name="regions" th:value="${opt.name}">
            <span th:text="${opt.name}">옵션</span>
        </label>
    </div>
    <div class="filter-popover-footer">
        <button type="button" class="btn-secondary"
                onclick="closeFilterPopover('regions')">취소</button>
        <button type="button" class="btn-primary"
                onclick="applyFilterPopover('regions')">적용</button>
    </div>
</div>

<div class="filter-popover-backdrop" data-group="centers"
     onclick="closeFilterPopover('centers')" style="display:none"></div>
<div class="filter-popover" data-group="centers" style="display:none">
    <div class="filter-popover-header">
        <h4>청년센터 전체</h4>
        <button type="button" class="filter-popover-close" aria-label="닫기"
                onclick="closeFilterPopover('centers')">×</button>
    </div>
    <input type="text" class="filter-popover-search" placeholder="검색"
           oninput="filterPopoverSearch('centers', this.value)"
           th:if="${allCenters != null and allCenters.size() > 8}">
    <div class="filter-popover-options">
        <label th:each="opt : ${allCenters}">
            <input type="checkbox" name="centers" th:value="${opt.name}">
            <span th:text="${opt.name}">옵션</span>
        </label>
    </div>
    <div class="filter-popover-footer">
        <button type="button" class="btn-secondary"
                onclick="closeFilterPopover('centers')">취소</button>
        <button type="button" class="btn-primary"
                onclick="applyFilterPopover('centers')">적용</button>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // 사이드바 체크박스 onchange — 현재 체크된 값으로 URL 재구성 후 htmx GET
    function onSidebarChange() {
        const params = new URLSearchParams(window.location.search);
        params.delete('regions');
        params.delete('centers');
        params.delete('page');

        document.querySelectorAll('#sidebar-region-list input[name="regions"]:checked, .filter-popover[data-group="regions"] input[name="regions"]:checked')
                .forEach(el => params.append('regions', el.value));
        document.querySelectorAll('#sidebar-center-list input[name="centers"]:checked, .filter-popover[data-group="centers"] input[name="centers"]:checked')
                .forEach(el => params.append('centers', el.value));

        const url = '/programs?' + params.toString();
        htmx.ajax('GET', url, { target: '#program-list-region', swap: 'innerHTML' });
        history.pushState({}, '', url);
    }

    // 칩 × 클릭 — 단일 값 제거
    function removeFilter(group, value) {
        const params = new URLSearchParams(window.location.search);
        const remaining = params.getAll(group).filter(v => v !== value);
        params.delete(group);
        remaining.forEach(v => params.append(group, v));
        params.delete('page');
        const url = '/programs?' + params.toString();
        htmx.ajax('GET', url, { target: '#program-list-region', swap: 'innerHTML' });
        history.pushState({}, '', url);

        // 사이드바 체크박스도 즉시 동기화 (사용자가 바로 다시 체크할 수 있도록)
        document.querySelectorAll('input[name="' + group + '"][value="' + CSS.escape(value) + '"]')
                .forEach(el => el.checked = false);
    }

    // 전체 초기화 — regions/centers 만 제거 (status/sort 유지)
    function resetAllFilters() {
        const params = new URLSearchParams(window.location.search);
        params.delete('regions');
        params.delete('centers');
        params.delete('page');
        const url = '/programs?' + params.toString();
        htmx.ajax('GET', url, { target: '#program-list-region', swap: 'innerHTML' });
        history.pushState({}, '', url);
        document.querySelectorAll('input[name="regions"], input[name="centers"]').forEach(el => el.checked = false);
    }

    // 팝오버 open
    function openFilterPopover(group) {
        const pop = document.querySelector('.filter-popover[data-group="' + group + '"]');
        const backdrop = document.querySelector('.filter-popover-backdrop[data-group="' + group + '"]');
        if (!pop) return;
        // 현재 사이드바 체크 상태를 팝오버에 동기화
        const sidebarChecked = new Set(
            Array.from(document.querySelectorAll('#sidebar-' + group.replace('s', '') + '-list input:checked'))
                 .map(el => el.value)
        );
        // 또한 URL 의 현재 값도 반영
        const urlChecked = new URLSearchParams(window.location.search).getAll(group);
        urlChecked.forEach(v => sidebarChecked.add(v));
        pop.querySelectorAll('input[type="checkbox"]').forEach(el => {
            el.checked = sidebarChecked.has(el.value);
        });
        pop.style.display = 'block';
        if (backdrop) backdrop.style.display = 'block';

        // 검색 박스 reset
        const search = pop.querySelector('.filter-popover-search');
        if (search) {
            search.value = '';
            pop.querySelectorAll('label').forEach(l => l.style.display = '');
        }
    }
    function closeFilterPopover(group) {
        const pop = document.querySelector('.filter-popover[data-group="' + group + '"]');
        const backdrop = document.querySelector('.filter-popover-backdrop[data-group="' + group + '"]');
        if (pop) pop.style.display = 'none';
        if (backdrop) backdrop.style.display = 'none';
    }
    function applyFilterPopover(group) {
        onSidebarChange();
        closeFilterPopover(group);
    }
    function filterPopoverSearch(group, q) {
        const pop = document.querySelector('.filter-popover[data-group="' + group + '"]');
        if (!pop) return;
        const lower = (q || '').toLowerCase();
        pop.querySelectorAll('label').forEach(l => {
            const text = (l.textContent || '').toLowerCase();
            l.style.display = (lower === '' || text.includes(lower)) ? '' : 'none';
        });
    }
</script>

</body>
</html>
