<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 무단 수집거부 — 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header('')}"></div>

<header class="policy-mobile-header">
    <a th:href="@{/}" class="policy-mobile-back" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    </a>
    <span class="policy-mobile-title">이메일 무단 수집거부</span>
</header>

<main class="main-content policy-layout">
    <div th:replace="~{fragments/policy-layout :: sidebar('email-policy')}"></div>

    <!-- wireframe L646~L652: 이메일 아이콘(primary 원) + 빨간 X 뱃지 + h1.
         260819 통일성 수정: privacy/terms 와 동일한 .policy-page-head + .policy-section 구조로 통일 (왼쪽 정렬). -->
    <article class="policy-content">
        <div class="policy-email-icon" aria-hidden="true">
            <svg th:replace="~{fragments/icons :: mail(36, 'var(--color-primary)')}"></svg>
            <span class="policy-email-icon-x">
                <svg th:replace="~{fragments/icons :: close(20, '#FFFFFF')}"></svg>
            </span>
        </div>

        <header class="policy-page-head">
            <h1 class="policy-page-title">이메일 무단 수집거부</h1>
            <p class="policy-page-updated">최종 개정일: 2026년 7월 1일</p>
        </header>

        <section class="policy-section">
            <p>본 사이트에 게시된 이메일 주소가 전자우편 수집 프로그램이나 그 밖의 기술적 장치를 이용하여
                무단으로 수집되는 것을 거부합니다. 이를 위반시 『정보통신망 이용 촉진 및 정보보호 등에 관한 법률』등에
                의해 처벌 받을 수 있습니다.</p>
        </section>

        <div th:replace="~{fragments/policy-layout :: mobileRelated('email-policy')}"></div>
    </article>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
