<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 결과 — 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-page-body">

<!-- F0i: 아이디 찾기 결과 (Step ② 활성). 마스킹된 이메일 표시. -->

<main class="auth-screen">
    <div class="auth-screen-inner auth-screen-inner--wide">

        <a th:href="@{/}" class="auth-logo-link">
            <img th:src="@{/images/logo_primary.png}" alt="청년모아" class="auth-logo-img">
        </a>

        <h2 class="auth-title">아이디 찾기</h2>

        <ol class="auth-stepper" aria-label="진행 단계">
            <li class="auth-step"><span class="auth-step-num">1</span>가입정보 입력</li>
            <li class="auth-step auth-step--active"><span class="auth-step-num">2</span>아이디 찾기</li>
        </ol>

        <div class="auth-result-box">
            <p class="auth-result-label">회원님의 아이디는 다음과 같습니다.</p>
            <p class="auth-result-email" th:text="${maskedEmail}">abc***@youth-moa.test</p>
        </div>

        <div class="auth-actions-column" style="margin-top: 20px;">
            <a th:href="@{/login}" class="btn-auth btn-auth--primary">로그인하기</a>
            <a th:href="@{/find-password}" class="btn-auth btn-auth--ghost">비밀번호 찾기</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
