<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 — 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body class="auth-page-body">

<!-- 260824: 모바일 back 헤더 (시안 1k). -->
<div th:replace="~{fragments/mobile-back-header :: header('back', '아이디 찾기')}"></div>

<!--
  F0i: 아이디 찾기 — 본인 확인 단계 (Step ① 활성).
  - 헤더 없음 / 푸터 있음 (login 톤 재사용)
  - 폭 400px (login 과 통일 — 2026-08-10)
  - Stepper: ① 가입정보 입력 (active) → ② 아이디 찾기
-->

<main class="auth-screen">
    <div class="auth-screen-inner auth-screen-inner--wide">

        <a th:href="@{/}" class="auth-logo-link">
            <img th:src="@{/images/logo_primary.png}" alt="청년모아" class="auth-logo-img">
        </a>

        <h2 class="auth-title">아이디 찾기</h2>

        <ol class="auth-stepper" aria-label="진행 단계">
            <li class="auth-step auth-step--active"><span class="auth-step-num">1</span>가입정보 입력</li>
            <li class="auth-step"><span class="auth-step-num">2</span>아이디 찾기</li>
        </ol>

        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

        <form th:action="@{/find-id}" th:object="${findIdRequest}" method="post"
              class="auth-form-prototype" novalidate>

            <input type="text" name="name" th:value="*{name}"
                   placeholder="이름을 입력해주세요."
                   autocomplete="name"
                   class="auth-input" required>
            <div th:if="${#fields.hasErrors('name')}" class="auth-field-error"
                 th:errors="*{name}"></div>

            <input type="tel" name="phone" th:value="*{phone}"
                   placeholder="핸드폰 번호를 입력해주세요."
                   autocomplete="tel"
                   class="auth-input" required>
            <div th:if="${#fields.hasErrors('phone')}" class="auth-field-error"
                 th:errors="*{phone}"></div>

            <div class="auth-actions-column" style="margin-top: 20px;">
                <button type="submit" class="btn-auth btn-auth--primary">확인</button>
                <a th:href="@{/login}" class="btn-auth btn-auth--secondary">로그인으로 돌아가기</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
