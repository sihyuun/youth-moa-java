<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 — 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body class="auth-page-body">

<!-- F0i: 비밀번호 재설정 (Step ② 활성). 세션 verifiedUserId 기반. -->

<main class="auth-screen">
    <div class="auth-screen-inner auth-screen-inner--wide">

        <a th:href="@{/}" class="auth-logo-link">
            <img th:src="@{/images/logo_primary.png}" alt="청년모아" class="auth-logo-img">
        </a>

        <h2 class="auth-title">비밀번호 찾기</h2>

        <ol class="auth-stepper" aria-label="진행 단계">
            <li class="auth-step"><span class="auth-step-num">1</span>본인 확인</li>
            <li class="auth-step auth-step--active"><span class="auth-step-num">2</span>새 비밀번호 설정</li>
        </ol>

        <form th:action="@{/find-password/reset}" th:object="${passwordResetRequest}" method="post"
              class="auth-form-prototype" novalidate>

            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>

            <input type="password" id="newPassword" name="password" th:value="*{password}"
                   placeholder="새 비밀번호 (영문+숫자 포함 8자 이상)"
                   autocomplete="new-password"
                   class="auth-input" required>
            <div th:if="${#fields.hasErrors('password')}" class="auth-field-error"
                 th:errors="*{password}"></div>

            <input type="password" id="newPasswordConfirm" name="passwordConfirm"
                   th:value="*{passwordConfirm}"
                   placeholder="새 비밀번호 확인"
                   autocomplete="new-password"
                   class="auth-input" required>
            <div th:if="${#fields.hasErrors('passwordConfirm')}" class="auth-field-error"
                 th:errors="*{passwordConfirm}"></div>

            <div class="auth-actions-column" style="margin-top: 20px;">
                <button type="submit" class="btn-auth btn-auth--primary">비밀번호 재설정</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
