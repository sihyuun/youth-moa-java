<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 — youth-moa</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>youth<span>moa</span></h1>
            <p>청년을 위한 정보 허브</p>
        </div>

        <div th:if="${logoutMsg}" class="alert alert-success" th:text="${logoutMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>
        <div th:if="${param.registered}" class="alert alert-success">
            회원가입이 완료되었습니다. 로그인해주세요.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">이메일</label>
                <input type="email" id="username" name="username"
                       placeholder="email@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password"
                       placeholder="비밀번호 입력" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-primary btn-full">로그인</button>
        </form>

        <p class="auth-footer">
            계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
        </p>
    </div>
</div>
</body>
</html>
