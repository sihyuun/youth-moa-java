<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 — 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body class="auth-page-body">

<!--
  prototype LoginScreen (line 1217~1254) + HANDOFF 5.5 기준:
  - 헤더 없음 / 푸터 있음
  - 본문: 중앙 정렬 (flex column, 화면 가득), 400px 폭
  - 상단 로고 이미지 (height:36)
  - "로그인" h2 (26px / 700)
  - input 2개 (height:46, 1.5px border, focus primary)
  - 옵션 row: 아이디 저장 체크박스 + 아이디·비밀번호찾기 링크
  - 버튼 2개 column (로그인 primary L / 회원가입 secondary L)
-->

<main class="auth-screen">
    <div class="auth-screen-inner">

        <!-- 로고 -->
        <a th:href="@{/}" class="auth-logo-link">
            <img th:src="@{/images/logo_primary.png}" alt="청년모아" class="auth-logo-img">
        </a>

        <!-- 타이틀 -->
        <h2 class="auth-title">로그인</h2>

        <!-- 알림 영역 (성공/오류) -->
        <div th:if="${param.registered}" class="alert alert-success">
            회원가입이 완료되었습니다. 로그인해주세요.
        </div>
        <div th:if="${param.reset}" class="alert alert-success">
            비밀번호가 재설정되었습니다. 새 비밀번호로 로그인해주세요.
        </div>
        <div th:if="${logoutMsg}" class="alert alert-success" th:text="${logoutMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

        <!-- 로그인 폼 -->
        <form th:action="@{/login}" method="post" class="auth-form-prototype">
            <!-- 실패 시 username 보존 (SecurityConfig 의 failureHandler 에서 flash 로 주입) -->
            <input type="email" name="username"
                   th:value="${savedUsername}"
                   placeholder="아이디(이메일)를 입력해주세요."
                   autocomplete="email"
                   class="auth-input"
                   required>
            <!-- 비밀번호 + 눈 아이콘 토글 (signup 패턴 재사용) -->
            <div class="auth-input-with-eye">
                <input type="password" id="loginPassword" name="password"
                       placeholder="비밀번호를 입력해주세요."
                       autocomplete="current-password"
                       class="auth-input auth-input--with-eye"
                       required>
                <button type="button" class="auth-eye-btn" data-target="loginPassword"
                        aria-label="비밀번호 표시 전환">
                    <svg class="auth-eye-icon" viewBox="0 0 24 24" width="18" height="18"
                         fill="none" stroke="currentColor" stroke-width="1.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <!-- 옵션 row -->
            <div class="auth-options">
                <label class="auth-checkbox">
                    <input type="checkbox" name="remember-me">
                    <!-- 라벨: Spring Security remember-me 실제 동작(세션 유지)과 일치 -->
                    <span>로그인 상태 유지</span>
                </label>
                <div class="auth-help-links">
                    <a th:href="@{/find-id}">아이디 찾기</a>
                    <span class="auth-help-sep">|</span>
                    <a th:href="@{/find-password}">비밀번호 찾기</a>
                </div>
            </div>

            <!-- 액션 버튼 (로그인 + 회원가입) -->
            <div class="auth-actions-column">
                <button type="submit" class="btn-auth btn-auth--primary">로그인</button>
                <a th:href="@{/signup}" class="btn-auth btn-auth--secondary">회원가입</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // 비밀번호 가시성 토글 (signup 의 .signup-eye-btn 패턴 재사용)
    document.querySelectorAll('.auth-eye-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-target');
            const input = document.getElementById(id);
            if (!input) return;
            const isText = input.type === 'text';
            input.type = isText ? 'password' : 'text';
            btn.classList.toggle('is-visible', !isText);
        });
    });
</script>

</body>
</html>
