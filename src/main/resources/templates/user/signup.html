<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 — youth-moa</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card auth-card--wide">
        <div class="auth-logo">
            <h1>youth<span>moa</span></h1>
            <p>회원가입</p>
        </div>

        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

        <form th:action="@{/signup}" th:object="${signUpRequest}" method="post" class="auth-form">

            <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                <label for="email">이메일 <span class="required">*</span></label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="email@example.com" autocomplete="email">
                <span class="field-error" th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                <label for="password">비밀번호 <span class="required">*</span></label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="8자 이상" autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"></span>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                <label for="name">이름 <span class="required">*</span></label>
                <input type="text" id="name" th:field="*{name}"
                       placeholder="홍길동" autocomplete="name">
                <span class="field-error" th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"></span>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('phone')} ? 'has-error'">
                <label for="phone">휴대폰 번호</label>
                <input type="tel" id="phone" th:field="*{phone}"
                       placeholder="01012345678 (숫자만)">
                <span class="field-error" th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}"></span>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('birthDate')} ? 'has-error'">
                <label for="birthDate">생년월일</label>
                <input type="date" id="birthDate" th:field="*{birthDate}">
                <span class="field-error" th:if="${#fields.hasErrors('birthDate')}"
                      th:errors="*{birthDate}"></span>
            </div>

            <button type="submit" class="btn-primary btn-full">가입하기</button>
        </form>

        <p class="auth-footer">
            이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
        </p>
    </div>
</div>
</body>
</html>
