<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 — 청년모아</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <!-- Daum Postcode API — 무료·API 키 불필요·도메인 등록 불필요 -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>

<!--
  prototype.tsx SignupScreen (line 1414~1539) 기준. 2026-07-27 gap-batch1: prototype 정합을 위해 전역 헤더 제거 (prototype 은 noHeader — 로고+폼 only).
  - 상단 로고 이미지는 signup 페이지 자체 로고 (홈 링크)
  - 비밀번호 눈 아이콘 유지 (UX 향상)
  - 중복확인/인증요청/우편번호 검색 — JS alert (prototype 패턴)
-->

<main class="signup-screen">
    <div class="signup-inner">

        <!-- 타이틀 (prototype L1868~1872): 로고 + 회원가입 헤딩 + subtitle -->
        <div class="signup-header">
            <a th:href="@{/}" class="signup-logo">
                <img th:src="@{/images/logo_primary.png}" alt="청년모아" class="signup-logo-img"/>
            </a>
            <h2 class="signup-title">회원가입</h2>
            <p class="signup-subtitle">몇 가지 정보만 입력하면 바로 시작할 수 있어요.</p>
        </div>

        <!-- 서버 측 에러 (중복 이메일 등) -->
        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

        <form th:action="@{/signup}" th:object="${signUpRequest}" method="post" novalidate>

            <!-- 폼 글로벌 에러 (비밀번호 불일치 등) -->
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>

            <!-- ════ 계정 정보 ════ -->
            <section class="form-card">
                <div class="form-card-head">
                    <span class="form-card-title">계정 정보</span>
                </div>

                <div class="signup-fields">
                    <!-- 아이디(이메일) + 중복확인 -->
                    <div class="signup-field-block" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                        <label for="email" class="signup-field-label">아이디 <span class="required">*</span></label>
                        <div class="signup-field-row">
                            <input type="email" id="email" th:field="*{email}"
                                   placeholder="아이디(이메일)를 입력해주세요."
                                   autocomplete="email"
                                   class="form-input">
                            <button type="button" id="emailCheckBtn"
                                    class="btn-outline-sm signup-side-btn">중복확인</button>
                        </div>
                        <!-- 서버 검증용 hidden: 중복확인 통과 시 true, 이메일 변경 시 false 로 reset -->
                        <input type="hidden" th:field="*{emailChecked}" id="emailCheckedHidden">
                        <p class="signup-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                        <p class="signup-field-error" th:if="${#fields.hasErrors('emailChecked')}" th:errors="*{emailChecked}"></p>
                    </div>

                    <!-- 비밀번호 (눈 아이콘 토글) -->
                    <div class="signup-field-block" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                        <label for="password" class="signup-field-label">비밀번호 <span class="required">*</span></label>
                        <div class="form-input-with-eye">
                            <!-- th:field 는 type=password 일 때 value 를 강제로 비움 (보안 기본).
                                 검증 실패 후 폼 재표시 시 입력값 보존을 위해 name/th:value 수동 명시. -->
                            <input type="password" id="password" name="password"
                                   th:value="*{password}"
                                   placeholder="영문, 숫자 포함 8자 이상"
                                   autocomplete="new-password"
                                   class="form-input form-input--with-eye">
                            <button type="button" class="signup-eye-btn" data-target="password"
                                    aria-label="비밀번호 표시 전환">
                                <svg class="signup-eye-icon" viewBox="0 0 24 24" width="18" height="18"
                                     fill="none" stroke="currentColor" stroke-width="1.5"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <!-- 비밀번호 정책 실시간 검증 (입력 시 JS 가 토글) -->
                        <p class="signup-field-error" id="pw-policy-msg" style="display:none"></p>
                        <!-- 서버 검증 실패 — passwordPolicyMsg 있으면 통합 메시지, 없으면 @errors (NotBlank 등) -->
                        <p class="signup-field-error" th:if="${passwordPolicyMsg}" th:text="${passwordPolicyMsg}"></p>
                        <p class="signup-field-error"
                           th:if="${#fields.hasErrors('password') and passwordPolicyMsg == null}"
                           th:errors="*{password}"></p>
                    </div>

                    <!-- 비밀번호 확인 (눈 아이콘 토글 + 실시간 검증) -->
                    <div class="signup-field-block" th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'has-error'">
                        <label for="passwordConfirm" class="signup-field-label">비밀번호 확인 <span class="required">*</span></label>
                        <div class="form-input-with-eye">
                            <input type="password" id="passwordConfirm" name="passwordConfirm"
                                   th:value="*{passwordConfirm}"
                                   placeholder="비밀번호를 다시 입력해주세요"
                                   autocomplete="new-password"
                                   class="form-input form-input--with-eye">
                            <button type="button" class="signup-eye-btn" data-target="passwordConfirm"
                                    aria-label="비밀번호 표시 전환">
                                <svg class="signup-eye-icon" viewBox="0 0 24 24" width="18" height="18"
                                     fill="none" stroke="currentColor" stroke-width="1.5"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <p class="signup-field-error" id="pw-mismatch-msg" style="display:none">비밀번호가 일치하지 않습니다.</p>
                        <p class="signup-field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
                        <!-- isPasswordMatched() @AssertTrue 결과 — Spring 이 "passwordMatched" 가상 필드 에러로 등록 -->
                        <p class="signup-field-error" th:if="${#fields.hasErrors('passwordMatched')}" th:errors="*{passwordMatched}"></p>
                    </div>
                </div>
            </section>

            <!-- ════ 개인 정보 ════ -->
            <section class="form-card">
                <div class="form-card-head">
                    <span class="form-card-title">개인 정보</span>
                </div>

                <div class="signup-fields">
                    <!-- 이름 -->
                    <div class="signup-field-block" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                        <label for="name" class="signup-field-label">이름 <span class="required">*</span></label>
                        <input type="text" id="name" th:field="*{name}"
                               placeholder="이름을 입력해주세요"
                               autocomplete="name"
                               class="form-input">
                        <p class="signup-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                    </div>

                    <!-- 핸드폰 번호 + 인증요청 (F-signup-01) -->
                    <div class="signup-field-block" th:classappend="${#fields.hasErrors('phone')} ? 'has-error'">
                        <label for="phone" class="signup-field-label">핸드폰 번호 <span class="required">*</span></label>
                        <div class="signup-field-row">
                            <input type="tel" id="phone" th:field="*{phone}"
                                   placeholder="숫자만 입력해주세요"
                                   class="form-input">
                            <!-- 사이드 버튼 1개 — 상태별 라벨 전환 (JS): 인증요청 / 재요청 / 재인증 -->
                            <button type="button" id="btn-send-code" class="btn-outline-sm signup-side-btn">인증요청</button>
                        </div>
                        <!-- 인증코드 입력행 — SENT/EXPIRED 상태에서 노출. VERIFIED 시 숨김 후 배지로 대체 -->
                        <div id="code-row" class="signup-field-row signup-code-row" hidden>
                            <span class="signup-code-input-wrap">
                                <input type="text" id="verify-code" inputmode="numeric" maxlength="6"
                                       placeholder="인증번호 6자리" class="form-input">
                                <span id="code-timer" class="signup-code-timer">3:00</span>
                            </span>
                            <button type="button" id="btn-verify-code" class="btn-outline-sm signup-side-btn" disabled>확인</button>
                        </div>
                        <!-- 인증완료 배지 — VERIFIED 시 code-row 자리 대체 노출 -->
                        <div id="phone-verified-badge" class="signup-verified-badge" hidden>
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            <span>휴대폰 인증이 완료되었어요.</span>
                        </div>
                        <!-- 안내 문구 (발송/만료 등) -->
                        <p id="phone-verify-help" class="signup-help-msg" hidden></p>
                        <p id="phone-verify-msg" class="signup-error-msg signup-field-error" hidden></p>
                        <!-- 서버 미신뢰 hidden — 폼 상태 UX 용 -->
                        <input type="hidden" th:field="*{phoneVerified}" id="phoneVerifiedHidden">
                        <p class="signup-field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                    </div>

                    <!-- 성별·생년월일 2컬럼 (prototype L1924~1940 flex gap:14) — 2026-08-10 복원 -->
                    <div class="signup-field-row-2col">
                        <!-- 성별 (prototype L1924~1935 pill 토글) — hidden radio 로 Spring form 바인딩 유지 -->
                        <div class="signup-field-block" th:classappend="${#fields.hasErrors('gender')} ? 'has-error'">
                            <span class="signup-field-label">성별 <span class="required">*</span></span>
                            <div class="signup-gender-pill-group" role="radiogroup" aria-label="성별">
                                <input type="radio" th:field="*{gender}" value="MALE" class="signup-gender-radio-input">
                                <input type="radio" th:field="*{gender}" value="FEMALE" class="signup-gender-radio-input">
                                <button type="button" class="signup-gender-pill" data-value="MALE"
                                        th:classappend="${signUpRequest.gender != null and signUpRequest.gender.name() == 'MALE'} ? 'is-selected'">
                                    <svg class="signup-gender-check" viewBox="0 0 24 24" width="15" height="15" fill="none"
                                         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                    <span>남</span>
                                </button>
                                <button type="button" class="signup-gender-pill" data-value="FEMALE"
                                        th:classappend="${signUpRequest.gender != null and signUpRequest.gender.name() == 'FEMALE'} ? 'is-selected'">
                                    <svg class="signup-gender-check" viewBox="0 0 24 24" width="15" height="15" fill="none"
                                         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                    <span>여</span>
                                </button>
                            </div>
                            <p class="signup-field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p>
                        </div>

                        <!-- 생년월일 — 브라우저 native date picker (type=date).
                             prototype 는 type=text placeholder="YYYY / MM / DD" 이지만, 접근성·모바일 UX·유효성
                             자동 검증 이점이 커 native picker 를 유지하는 의도적 이탈 (2026-08-10 결정). -->
                        <div class="signup-field-block" th:classappend="${#fields.hasErrors('birthDateText')} ? 'has-error'">
                            <label for="birthDateText" class="signup-field-label">생년월일 <span class="required">*</span></label>
                            <input type="date" id="birthDateText" th:field="*{birthDateText}"
                                   max="2099-12-31" required
                                   class="form-input form-input--date">
                            <p class="signup-field-error" th:if="${#fields.hasErrors('birthDateText')}" th:errors="*{birthDateText}"></p>
                        </div>
                    </div>

                    <!-- 주소 (우편번호 readonly + 검색 SVG / 주소 readonly / 상세주소) -->
                    <div class="signup-field-block" th:classappend="${#fields.hasErrors('zipcode') or #fields.hasErrors('address')} ? 'has-error'">
                        <span class="signup-field-label">주소 <span class="required">*</span></span>
                        <div class="signup-address-stack">
                            <div class="signup-field-row">
                                <input type="text" id="zipcode" th:field="*{zipcode}"
                                       placeholder="우편번호" readonly
                                       class="form-input form-input--readonly">
                                <button type="button" id="postcodeSearchBtn"
                                        class="btn-outline-sm signup-side-btn signup-search-btn">
                                    <svg viewBox="0 0 24 24" width="14" height="14"
                                         fill="none" stroke="currentColor" stroke-width="1.5">
                                        <circle cx="11" cy="11" r="8"/>
                                        <path d="M21 21l-4.35-4.35" stroke-linecap="round"/>
                                    </svg>
                                    <span>검색</span>
                                </button>
                            </div>
                            <input type="text" id="address" th:field="*{address}"
                                   placeholder="주소 (검색으로 입력)" readonly
                                   class="form-input form-input--readonly">
                            <input type="text" id="addressDetail" th:field="*{addressDetail}"
                                   placeholder="상세주소를 입력해주세요"
                                   class="form-input">
                        </div>
                        <p class="signup-field-error" th:if="${#fields.hasErrors('zipcode')}" th:errors="*{zipcode}"></p>
                        <p class="signup-field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
                    </div>
                </div>
            </section>

            <!-- ════ 이용약관 동의 ════ -->
            <section class="form-card">
                <div class="form-card-head">
                    <span class="form-card-title">이용약관 동의</span>
                </div>

                <!-- 전체 동의 -->
                <label class="signup-agree-all">
                    <input type="checkbox" id="agreeAll">
                    <span class="signup-checkbox-square"></span>
                    <span class="signup-agree-all-text">전체 동의</span>
                </label>

                <!-- F-signup-terms-agreement: activeTerms 목록 동적 렌더. data-term-code 안정 셀렉터로 E2E 대응. -->
                <div class="signup-agree-row" th:each="term : ${activeTerms}" th:attr="data-term-code=${term.code}">
                    <label class="signup-agree-item">
                        <input type="checkbox"
                               class="signup-term-checkbox"
                               th:name="'agreements[' + ${term.code} + ']'"
                               th:value="true"
                               th:checked="${signUpRequest.agreements != null and signUpRequest.agreements.get(term.code) == true}"
                               th:attr="data-term-code=${term.code}">
                        <span class="signup-checkbox-line"></span>
                        <span class="signup-agree-label">
                            <span th:text="${term.title}">회원가입약관</span>
                            <span th:if="${term.required}" class="required-inline"> (필수)</span>
                            <span th:unless="${term.required}" class="optional-inline"> (선택)</span>
                        </span>
                    </label>
                    <a th:href="${term.contentPath}" target="_blank" rel="noopener"
                       th:attr="data-modal-title=${term.title}"
                       class="signup-agree-view">약관보기 ›</a>
                </div>

                <!-- 필수 약관 미동의 에러 (컨트롤러가 rejectValue 로 등록) -->
                <p class="signup-field-error" th:if="${#fields.hasErrors('agreements')}" th:errors="*{agreements}"></p>
            </section>

            <!-- ════ 액션 (prototype L1975~1978: fullWidth 회원가입 + 로그인 링크) ════ -->
            <div class="signup-actions">
                <button type="submit" class="btn-auth btn-auth--primary signup-submit-btn">회원가입</button>
            </div>
            <p class="signup-login-link">
                이미 계정이 있으신가요?
                <a th:href="@{/login}">로그인</a>
            </p>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- F-signup-terms-agreement (2026-07-30): 약관보기 모달. JS 로 /terms · /privacy 페이지를 fetch 하여 .policy-page 만 injection. -->
<div id="terms-modal" class="terms-modal" hidden role="dialog" aria-modal="true" aria-labelledby="terms-modal-title" aria-hidden="true">
    <div class="terms-modal-backdrop" data-terms-modal-close></div>
    <div class="terms-modal-panel">
        <div class="terms-modal-head">
            <h2 id="terms-modal-title" class="terms-modal-title">약관 보기</h2>
            <button type="button" class="terms-modal-close" data-terms-modal-close aria-label="닫기">×</button>
        </div>
        <div class="terms-modal-body" id="terms-modal-body">
            <p class="terms-modal-loading">불러오는 중...</p>
        </div>
        <div class="terms-modal-foot">
            <button type="button" id="terms-modal-agree" class="btn-primary">동의</button>
        </div>
    </div>
</div>

<script>
    // 비밀번호 가시성 토글 (눈 아이콘 클릭 시 password ↔ text)
    document.querySelectorAll('.signup-eye-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-target');
            const input = document.getElementById(id);
            if (!input) return;
            const isText = input.type === 'text';
            input.type = isText ? 'password' : 'text';
            btn.classList.toggle('is-visible', !isText);
        });
    });

    // 비밀번호 정책 실시간 검증 — 어조: "비밀번호는 ~해야 합니다." (SignUpRequest 의 @Size/@Pattern 메시지와 통일)
    (function () {
        const pw = document.getElementById('password');
        const msg = document.getElementById('pw-policy-msg');
        if (!pw || !msg) return;

        function buildMessage(v) {
            const missingLen = v.length < 8;
            const missingEng = !/[A-Za-z]/.test(v);
            const missingDigit = !/\d/.test(v);
            if (!missingLen && !missingEng && !missingDigit) return null;

            const parts = [];
            if (missingLen) parts.push('8자 이상이어야');
            if (missingEng && missingDigit) parts.push('영문과 숫자를 모두 포함해야');
            else if (missingEng) parts.push('영문을 포함해야');
            else if (missingDigit) parts.push('숫자를 포함해야');

            // 1개 → "비밀번호는 X 합니다."
            // 2개 → "비밀번호는 X 하고, Y 합니다."
            if (parts.length === 1) return `비밀번호는 ${parts[0]} 합니다.`;
            return `비밀번호는 ${parts[0]} 하고, ${parts[1]} 합니다.`;
        }

        function checkPolicy() {
            const v = pw.value;
            if (!v) {
                msg.style.display = 'none';
                msg.classList.remove('signup-field-ok');
                pw.classList.remove('form-input--mismatch');
                return true;
            }
            const text = buildMessage(v);
            if (text) {
                msg.textContent = text;
                msg.style.display = 'block';
                msg.classList.remove('signup-field-ok');
                pw.classList.add('form-input--mismatch');
                return false;
            }
            // 정책 충족 — ✓ 초록 표시 (컬리 패턴: 충족 피드백)
            msg.textContent = '✓ 비밀번호 조건을 모두 충족했습니다.';
            msg.style.display = 'block';
            msg.classList.add('signup-field-ok');
            pw.classList.remove('form-input--mismatch');
            return true;
        }
        pw.addEventListener('input', checkPolicy);
    })();

    // 비밀번호 확인 실시간 검증 (prototype.tsx 의 즉시 검증 패턴 재현)
    (function () {
        const pw = document.getElementById('password');
        const pw2 = document.getElementById('passwordConfirm');
        const msg = document.getElementById('pw-mismatch-msg');
        if (!pw || !pw2 || !msg) return;
        function check() {
            if (pw2.value && pw.value !== pw2.value) {
                msg.style.display = 'block';
                pw2.classList.add('form-input--mismatch');
            } else {
                msg.style.display = 'none';
                pw2.classList.remove('form-input--mismatch');
            }
        }
        pw.addEventListener('input', check);
        pw2.addEventListener('input', check);
    })();

    // 전체 동의 토글 — F-signup-terms-agreement: 약관 목록이 동적이므로 공통 셀렉터(.signup-term-checkbox) 로 순회.
    // name 은 agreements[SERVICE] 등 code 별로 다르므로 셀렉터로 대체.
    (function () {
        const all = document.getElementById('agreeAll');
        const boxes = document.querySelectorAll('.signup-term-checkbox');
        if (!all || boxes.length === 0) return;
        function syncAll() {
            all.checked = Array.from(boxes).every(b => b.checked);
        }
        all.addEventListener('change', () => {
            boxes.forEach(b => { b.checked = all.checked; });
        });
        boxes.forEach(b => b.addEventListener('change', syncAll));
        syncAll();
    })();

    // F-signup-terms-agreement (2026-07-30): 약관보기 모달. 새 탭 이동 대신 오버레이 팝업으로 회원가입 흐름 유지.
    // JS 비활성화 시엔 <a> 기본 동작(새 탭)이 fallback 으로 남는다.
    (function () {
        const modal = document.getElementById('terms-modal');
        const modalBody = document.getElementById('terms-modal-body');
        const modalTitle = document.getElementById('terms-modal-title');
        const agreeBtn = document.getElementById('terms-modal-agree');
        if (!modal || !modalBody || !modalTitle || !agreeBtn) return;

        function openModal() {
            modal.hidden = false;
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modal.hidden = true;
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            modalBody.innerHTML = '<p class="terms-modal-loading">불러오는 중...</p>';
            delete modal.dataset.currentTermCode;
        }
        modal.querySelectorAll('[data-terms-modal-close]').forEach(el =>
            el.addEventListener('click', closeModal));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.hidden) closeModal();
        });

        // 동의 버튼 → 해당 term 체크박스 check + change 이벤트 발화 (전체 동의 sync 자동 처리)
        agreeBtn.addEventListener('click', () => {
            const code = modal.dataset.currentTermCode;
            if (code) {
                const cb = document.querySelector('.signup-term-checkbox[data-term-code="' + code + '"]');
                if (cb && !cb.checked) {
                    cb.checked = true;
                    cb.dispatchEvent(new Event('change', { bubbles: true }));
                }
            }
            closeModal();
        });

        document.querySelectorAll('.signup-agree-view').forEach(link => {
            link.addEventListener('click', async (e) => {
                e.preventDefault();
                const url = link.getAttribute('href');
                // .signup-agree-row 의 data-term-code 상속 (개별 checkbox 와 동일 code)
                const row = link.closest('[data-term-code]');
                modal.dataset.currentTermCode = row ? row.getAttribute('data-term-code') : '';
                modalTitle.textContent = link.getAttribute('data-modal-title') || '약관 보기';
                modalBody.innerHTML = '<p class="terms-modal-loading">불러오는 중...</p>';
                openModal();
                try {
                    const res = await fetch(url, { credentials: 'same-origin' });
                    if (!res.ok) throw new Error(res.status);
                    const html = await res.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const content = doc.querySelector('.policy-page');
                    if (content) {
                        // 원본 페이지의 하단 "회원가입으로 돌아가기" 버튼은 모달 컨텍스트에서 부적절 → 제거
                        const foot = content.querySelector('.policy-page-foot');
                        if (foot) foot.remove();
                        modalBody.innerHTML = content.outerHTML;
                    } else {
                        modalBody.innerHTML = '<p class="terms-modal-error">내용을 불러올 수 없습니다.</p>';
                    }
                } catch {
                    modalBody.innerHTML = '<p class="terms-modal-error">내용을 불러올 수 없습니다.</p>';
                }
            });
        });
    })();

    // 아이디 중복확인 — 서버 API 호출 + emailChecked hidden 갱신
    (function () {
        const emailInput = document.getElementById('email');
        const btn = document.getElementById('emailCheckBtn');
        const hidden = document.getElementById('emailCheckedHidden');
        if (!emailInput || !btn || !hidden) return;

        // 이메일을 변경하면 중복확인 상태 초기화 (확인 후 변조 우회 차단)
        emailInput.addEventListener('input', () => {
            hidden.value = 'false';
        });

        btn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                alert('이메일을 먼저 입력해주세요.');
                return;
            }
            // 형식 1차 체크 (서버 부담 줄이기)
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('올바른 이메일 형식이 아닙니다.');
                return;
            }
            try {
                const res = await fetch('/api/users/check-email?email=' + encodeURIComponent(email));
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.available) {
                    alert('사용 가능한 아이디입니다.');
                    hidden.value = 'true';
                } else {
                    alert('이미 사용 중인 이메일입니다.');
                    hidden.value = 'false';
                }
            } catch (e) {
                alert('중복확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                hidden.value = 'false';
            }
        });
    })();

    // 성별 pill 토글 — hidden radio 값 동기화 (prototype L1929)
    (function () {
        const pills = document.querySelectorAll('.signup-gender-pill');
        const radios = document.querySelectorAll('.signup-gender-radio-input');
        if (!pills.length || !radios.length) return;
        pills.forEach(pill => {
            pill.addEventListener('click', () => {
                const v = pill.getAttribute('data-value');
                pills.forEach(p => p.classList.toggle('is-selected', p === pill));
                radios.forEach(r => { r.checked = (r.value === v); });
                // Spring form binding trigger
                const matched = Array.from(radios).find(r => r.value === v);
                if (matched) matched.dispatchEvent(new Event('change', { bubbles: true }));
            });
        });
    })();

    // (F-signup-01 phone 인증 로직은 /js/signup-phone.js 로 분리)

    // 우편번호 검색 — Daum Postcode API 연동 (무료·API 키 불필요)
    (function () {
        const btn = document.getElementById('postcodeSearchBtn');
        if (!btn) return;

        btn.addEventListener('click', function () {
            if (typeof daum === 'undefined' || !daum.Postcode) {
                alert('우편번호 서비스를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
                return;
            }
            new daum.Postcode({
                oncomplete: function (data) {
                    const zip = document.getElementById('zipcode');
                    const addr = document.getElementById('address');
                    const detail = document.getElementById('addressDetail');
                    if (!zip || !addr) return;
                    zip.value = data.zonecode;
                    addr.value = data.roadAddress || data.jibunAddress;
                    // input 이벤트 발생시켜 :not(:placeholder-shown) 등 CSS 트리거 + 검증 갱신
                    zip.dispatchEvent(new Event('input', { bubbles: true }));
                    addr.dispatchEvent(new Event('input', { bubbles: true }));
                    if (detail) detail.focus();
                }
            }).open();
        });
    })();
</script>

<script th:src="@{/js/signup-phone.js}"></script>

</body>
