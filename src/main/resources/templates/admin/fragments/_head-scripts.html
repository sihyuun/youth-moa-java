<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  admin 전용 head-scripts fragment (F-admin-scripts-fragment).
  - CSRF meta 2개 + HTMX 코어 + htmx-csrf 훅 + common-ui 순서 고정
  - 모든 admin 화면(_head-scripts.html 15개)에서 <head> 내부에 th:replace 로 삽입
  - 페이지 특유 script (admin-bulk.js, 인라인 <script>) 는 각 페이지 <body> 하단 유지
-->
<th:block th:fragment="scripts">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/htmx-csrf.js}" defer></script>
    <script th:src="@{/js/common-ui.js}" defer></script>
</th:block>
</html>
