<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
  A1 admin 다크 헤더 (prototype.html L336~537 · HANDOFF §헤더).
  56px · #111827 bg · sticky top:0 · z-index:500.
  좌: 로고(white,34px) + ADMIN 뱃지 + 센터 스코프 셀렉터 (표시만, A7 실동작).
  중앙(absolute): GNB — Qn-6 B "미구현 GNB 는 렌더 안 함". 대시보드는 유일 활성.
  우: 검색 자리 · 알림 벨 자리 · 유저 드롭다운 (로그아웃 실동작 · 사용자 페이지 링크).
-->
<header th:fragment="header(currentPage, centerScopeLabel, isSystemAdmin)" class="admin-header">

    <div class="admin-header-left">
        <a th:href="@{/admin}" class="admin-header-logo-link">
            <img th:src="@{/images/logo_white.png}" alt="청년모아" class="admin-header-logo">
        </a>
        <span class="admin-header-badge">ADMIN</span>

        <div class="admin-header-divider"></div>

        <!-- 센터 스코프 셀렉터 — A1 은 표시만 (A7 에서 SYSTEM_ADMIN 드롭다운 실동작) -->
        <div class="admin-header-scope"
             th:classappend="${isSystemAdmin} ? ' admin-header-scope--system' : ' admin-header-scope--center'">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/>
            </svg>
            <span class="admin-header-scope-label" th:text="${centerScopeLabel}">전체</span>
            <svg th:if="${isSystemAdmin}" viewBox="0 0 24 24" width="11" height="11"
                 fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </div>
    </div>

    <!--
      Qn-6 B: 통계·프로그램 관리·사용자 관리 GNB 는 A2/A5/A6 미구현 → 렌더 안 함 (deviation 기록).
      대시보드 진입 시 활성 표시할 유일 항목이 없으므로 A1 은 nav 자체를 비운다.
    -->
    <nav class="admin-header-nav" aria-label="관리자 메뉴">
        <a th:href="@{/admin}"
           th:class="${currentPage == 'dashboard'} ? 'admin-nav-link active' : 'admin-nav-link'">대시보드</a>
        <a th:href="@{/admin/programs}"
           th:class="${currentPage == 'programs'} ? 'admin-nav-link active' : 'admin-nav-link'">프로그램 관리</a>
        <!-- A6 admin-stats (2026-09-16) -->
        <a th:href="@{/admin/stats}"
           th:class="${currentPage == 'stats'} ? 'admin-nav-link active' : 'admin-nav-link'">통계</a>
        <!-- A5 admin-users (2026-09-15): SYSTEM_ADMIN 전용 (Qn-A 이월로 별도 staff 화면 X). -->
        <a sec:authorize="hasRole('SYSTEM_ADMIN')"
           th:href="@{/admin/users}"
           th:class="${currentPage == 'users'} ? 'admin-nav-link active' : 'admin-nav-link'">사용자 관리</a>
        <a th:href="@{/admin/notices}"
           th:class="${currentPage == 'notices'} ? 'admin-nav-link active' : 'admin-nav-link'">공지 관리</a>
        <a th:href="@{/admin/terms}"
           th:class="${currentPage == 'terms'} ? 'admin-nav-link active' : 'admin-nav-link'">약관 관리</a>
    </nav>

    <div class="admin-header-right">
        <!-- 검색 자리 (A7 실동작) -->
        <button type="button" class="admin-header-icon-btn" aria-label="검색 (A7 도입 예정)" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>

        <!--
          A7 admin 헤더 알림 벨 (2026-09-17) — 실동작.
          · 벨 클릭 시 hx-get 으로 최근 5건 드롭다운 fetch → #admin-notif-dropdown 대체.
          · 30s polling wrapper 가 배지만 주기적으로 갱신 (드롭다운 트래픽 최소화, Qn-1).
          · Qn-6: unread=0 이면 배지 자체를 hidden 속성으로 완전 숨김.
        -->
        <div class="admin-header-notif" data-dropdown-trigger-wrap="admin-notif-dropdown">
            <button type="button"
                    class="admin-header-icon-btn admin-header-bell"
                    aria-label="알림"
                    aria-haspopup="menu"
                    aria-controls="admin-notif-dropdown"
                    aria-expanded="false"
                    data-dropdown-trigger="admin-notif-dropdown"
                    hx-get="/admin/notifications/dropdown"
                    hx-target="#admin-notif-dropdown"
                    hx-swap="innerHTML"
                    hx-trigger="click">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 01-3.46 0"/>
                </svg>
                <!--/* 초기 배지 — 이후 polling 이 outerHTML 로 교체. adminHeaderUnreadCount 는 AdminHeaderNotificationAdvice 가 주입 */-->
                <div th:replace="~{admin/fragments/_notification-badge :: badge(${adminHeaderUnreadCount})}"></div>
            </button>
            <!--/* 30s polling — hx-swap="outerHTML" 로 이 wrapper 자체를 새 응답으로 교체하면 안 됨(hx-trigger 유실). span 만 대체하도록 badge fragment 를 target 삼는다. */-->
            <div hx-get="/admin/notifications/badge"
                 hx-trigger="every 30s"
                 hx-target="#admin-notif-badge"
                 hx-swap="outerHTML"
                 hx-select="#admin-notif-badge"
                 aria-hidden="true"
                 style="display:none"></div>
            <div id="admin-notif-dropdown" class="admin-notif-dropdown" role="menu" hidden></div>
        </div>

        <!-- 유저 드롭다운 -->
        <div class="admin-header-user-menu">
            <button type="button" class="admin-header-user-trigger"
                    data-dropdown-trigger="admin-user-dropdown"
                    aria-haspopup="menu" aria-controls="admin-user-dropdown" aria-expanded="false">
                <span class="admin-header-avatar" aria-hidden="true"
                      th:text="${#strings.substring(#authentication.principal.displayName, 0, 1)}">관</span>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
            <div id="admin-user-dropdown" class="admin-header-user-dropdown" role="menu" hidden>
                <div class="admin-header-user-profile">
                    <div class="admin-header-user-name"
                         th:text="${#authentication.principal.displayName}">관리자</div>
                    <div class="admin-header-user-role"
                         sec:authorize="hasRole('SYSTEM_ADMIN')">시스템 관리자</div>
                    <div class="admin-header-user-role"
                         sec:authorize="hasRole('CENTER_ADMIN')">센터 관리자</div>
                    <div class="admin-header-user-email"
                         th:text="${#authentication.principal.email}">admin@example.com</div>
                </div>
                <div class="admin-header-user-menu-body">
                    <a th:href="@{/}" class="admin-header-dropdown-item" role="menuitem">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                             stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4a1 1 0 001-1v-4h2v4a1 1 0 001 1h4a1 1 0 001-1V10"/>
                        </svg>
                        <span>사용자 페이지</span>
                    </a>
                    <form th:action="@{/admin/logout}" method="post" class="admin-header-logout-form">
                        <button type="submit" class="admin-header-dropdown-item admin-header-dropdown-item--danger"
                                role="menuitem">
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            <span>로그아웃</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
