<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  A7 admin 헤더 알림 벨 (2026-09-17) — 드롭다운 fragment.

  · 300px 폭 라이트 카드 (다크 헤더 위) — prototype admin L443~493 정합
  · 최근 5건 (Qn-2). 전체보기 링크 없음 (Qn-2 이월)
  · 각 item: 아이콘(30x30 rounded) + 제목/메시지 + 시간 + 우측 세로 스택 (삭제 X 위, unread dot 아래)
  · Qn-6: unread > 0 시 dot 노출
  · 링크: NEW_APPLICATION → /admin/programs/{id}/applications, NEW_USER → /admin/users/{id} — Notification.link 컬럼에 이미 기록됨
  · 응답은 innerHTML 로 #admin-notif-dropdown 에 삽입되므로 fragment root 는 컨텐츠(패널) 자체.
-->
<div th:fragment="dropdown" class="admin-notif-panel">
    <div class="admin-notif-panel-header">
        <span class="admin-notif-panel-title">알림</span>
        <button type="button"
                class="admin-notif-mark-all"
                hx-post="/admin/notifications/mark-all-read"
                hx-target="#admin-notif-dropdown"
                hx-swap="innerHTML"
                th:if="${adminUnreadCount != null and adminUnreadCount > 0}">
            모두 읽음
        </button>
    </div>

    <ul class="admin-notif-list" th:if="${adminNotifications != null and !adminNotifications.isEmpty()}">
        <li th:each="n : ${adminNotifications}"
            th:id="'admin-notif-item-' + ${n.id}"
            th:class="${n.isRead()} ? 'admin-notif-item' : 'admin-notif-item admin-notif-item--unread'">
            <a th:href="@{|/admin/notifications/${n.id}/read|}"
               th:attr="hx-post=@{|/admin/notifications/${n.id}/read|}"
               hx-swap="none"
               class="admin-notif-item-link">
                <span th:class="'admin-notif-icon admin-notif-icon--' + ${n.type.toneColor}"
                      aria-hidden="true">
                    <!--/* prototype 아이콘 매핑 — 최소 SVG 인라인. iconName 값별 분기 (bell/check/close/calendar). */-->
                    <svg th:if="${n.type.iconName == 'bell'}" viewBox="0 0 24 24" width="15" height="15" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 01-3.46 0"/>
                    </svg>
                    <svg th:if="${n.type.iconName == 'check'}" viewBox="0 0 24 24" width="15" height="15" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <svg th:if="${n.type.iconName == 'close'}" viewBox="0 0 24 24" width="15" height="15" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    <svg th:if="${n.type.iconName == 'calendar'}" viewBox="0 0 24 24" width="15" height="15" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                </span>
                <div class="admin-notif-body">
                    <div class="admin-notif-title" th:text="${n.title}">알림 제목</div>
                    <div class="admin-notif-message" th:text="${n.message}">알림 메시지</div>
                    <time class="admin-notif-time"
                          th:datetime="${#temporals.format(n.createdAt, 'yyyy-MM-dd''T''HH:mm')}"
                          th:text="${#temporals.format(n.createdAt, 'MM.dd HH:mm')}">09.17 12:34</time>
                </div>
                <div class="admin-notif-actions">
                    <button type="button"
                            class="admin-notif-delete"
                            aria-label="삭제"
                            th:attr="hx-post=@{|/admin/notifications/${n.id}/delete|},hx-target='#admin-notif-item-' + ${n.id}"
                            hx-swap="delete">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none"
                             stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                    <span class="admin-notif-unread-dot"
                          th:if="${!n.isRead()}"
                          aria-hidden="true"></span>
                </div>
            </a>
        </li>
    </ul>

    <div class="admin-notif-empty"
         th:if="${adminNotifications == null or adminNotifications.isEmpty()}">
        새로운 알림이 없어요.
    </div>
</div>
</body>
</html>
