<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|신청 상세 — ${app.user.name} — 청년모아 관리자|">신청 상세</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body class="admin-shell-body">

<div th:replace="~{admin/fragments/header :: header('programs', ${centerScopeLabel}, ${isSystemAdmin})}"></div>

<main class="admin-shell-main">
    <div class="admin-program-form-page" th:fragment="modal">

        <section class="admin-program-form-header">
            <div class="admin-program-form-breadcrumb">
                <a th:href="@{/admin/programs/{id}/applications(id=${programId})}"
                   class="admin-program-breadcrumb-link"
                   data-testid="back-to-list">← 신청 목록</a>
            </div>
            <div class="admin-program-form-title-row">
                <div>
                    <h2 class="admin-program-form-title">프로그램 신청 상세</h2>
                    <p class="admin-program-form-sub"
                       th:text="${app.program.title}">프로그램명</p>
                </div>
                <div class="admin-program-form-header-meta">
                    <span class="admin-application-status-badge"
                          th:classappend="'admin-application-status-badge--' + ${#strings.toLowerCase(app.status.name())}"
                          th:text="${app.status.name() == 'PENDING'} ? '대기' :
                                   (${app.status.name() == 'APPROVED'} ? '승인' :
                                   (${app.status.name() == 'REJECTED'} ? '반려' : '취소'))"
                          data-testid="detail-status-badge">대기</span>
                </div>
            </div>
        </section>

        <!-- 신청자 정보 -->
        <section class="admin-application-detail-section" data-testid="detail-user-info">
            <h3 class="admin-application-detail-section-title">신청자 정보</h3>
            <div class="admin-application-detail-grid">
                <div>
                    <span class="admin-application-detail-label">이름</span>
                    <span class="admin-application-detail-value" th:text="${app.user.name}">이름</span>
                </div>
                <div>
                    <span class="admin-application-detail-label">이메일</span>
                    <span class="admin-application-detail-value" th:text="${app.user.email}">이메일</span>
                </div>
                <div>
                    <span class="admin-application-detail-label">성별</span>
                    <span class="admin-application-detail-value"
                          th:text="${app.user.gender != null} ? ${app.user.gender.name()} : '-'">-</span>
                </div>
                <div>
                    <span class="admin-application-detail-label">핸드폰</span>
                    <span class="admin-application-detail-value"
                          th:text="${app.user.phone != null} ? ${app.user.phone} : '-'">-</span>
                </div>
                <div>
                    <span class="admin-application-detail-label">접수일시</span>
                    <span class="admin-application-detail-value"
                          th:text="${#temporals.format(app.appliedAt, 'yyyy-MM-dd HH:mm')}">2026-09-15 00:00</span>
                </div>
                <div>
                    <span class="admin-application-detail-label">참여횟수</span>
                    <span class="admin-application-detail-value"
                          th:text="${visits[app.user.id] != null} ? ${visits[app.user.id]} : 0">0</span>
                </div>
            </div>
        </section>

        <!-- 지원 동기 -->
        <section class="admin-application-detail-section" th:if="${app.applyReason != null}">
            <h3 class="admin-application-detail-section-title">지원 동기</h3>
            <div class="admin-application-detail-textbox" th:text="${app.applyReason}"
                 data-testid="apply-reason">지원 동기</div>
        </section>

        <!-- F0c 동적 응답 -->
        <section class="admin-application-detail-section" th:if="${!answers.isEmpty()}"
                 data-testid="detail-answers">
            <h3 class="admin-application-detail-section-title">신청 답변</h3>
            <div th:each="ans : ${answers}" class="admin-application-answer-item">
                <div class="admin-application-answer-label"
                     th:text="${ans.question.label}">질문</div>
                <div th:if="${ans.value != null}"
                     th:classappend="${ans.question.fieldType.name() == 'DROPDOWN'} ? 'admin-application-answer-pill' : 'admin-application-detail-textbox'"
                     th:text="${ans.value}">답변</div>
                <div th:if="${ans.attachmentFilename != null}" class="admin-application-answer-file">
                    <span th:text="${ans.attachmentFilename}">파일명</span>
                </div>
            </div>
        </section>

        <!-- 처리 이력 -->
        <section class="admin-application-detail-section" th:if="${app.processedAt != null}">
            <h3 class="admin-application-detail-section-title">처리 이력</h3>
            <div class="admin-application-detail-grid">
                <div>
                    <span class="admin-application-detail-label">처리일시</span>
                    <span class="admin-application-detail-value"
                          th:text="${#temporals.format(app.processedAt, 'yyyy-MM-dd HH:mm')}">-</span>
                </div>
                <div th:if="${app.processedBy != null}">
                    <span class="admin-application-detail-label">처리자</span>
                    <span class="admin-application-detail-value" th:text="${app.processedBy.name}">-</span>
                </div>
                <div th:if="${app.rejectReason != null}">
                    <span class="admin-application-detail-label">반려 사유</span>
                    <span class="admin-application-detail-value" th:text="${app.rejectReason}">-</span>
                </div>
                <div th:if="${app.cancelReason != null}">
                    <span class="admin-application-detail-label">취소 사유</span>
                    <span class="admin-application-detail-value" th:text="${app.cancelReason}">-</span>
                </div>
            </div>
        </section>

        <!-- 상태 변경 액션 -->
        <section class="admin-application-detail-section">
            <h3 class="admin-application-detail-section-title">상태 변경</h3>
            <div class="admin-application-actions">
                <form method="post"
                      th:action="@{/admin/programs/{id}/applications/{aid}/approve(id=${programId},aid=${app.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="admin-btn admin-btn--primary"
                            data-testid="btn-approve">승인</button>
                </form>

                <form method="post"
                      th:action="@{/admin/programs/{id}/applications/{aid}/reject(id=${programId},aid=${app.id})}"
                      class="admin-application-inline-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="text" name="rejectReason"
                           class="admin-program-form-input"
                           placeholder="반려 사유 (필수)"
                           required
                           data-testid="reject-reason-input"/>
                    <button type="submit" class="admin-btn admin-btn--danger-outline"
                            data-testid="btn-reject">반려</button>
                </form>

                <form method="post"
                      th:action="@{/admin/programs/{id}/applications/{aid}/cancel(id=${programId},aid=${app.id})}"
                      class="admin-application-inline-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="text" name="cancelReason"
                           class="admin-program-form-input"
                           placeholder="취소 사유 (필수)"
                           required
                           data-testid="cancel-reason-input"/>
                    <button type="submit" class="admin-btn admin-btn--danger"
                            data-testid="btn-cancel">강제 취소</button>
                </form>
            </div>
        </section>

        <!-- 담당자 의견 -->
        <section class="admin-application-detail-section">
            <h3 class="admin-application-detail-section-title">담당자 의견</h3>
            <form method="post"
                  th:action="@{/admin/programs/{id}/applications/{aid}/note(id=${programId},aid=${app.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <textarea name="adminNote"
                          class="admin-program-form-input"
                          rows="4"
                          maxlength="1000"
                          placeholder="담당자 의견을 입력해주세요. 사용자에게 노출됩니다."
                          data-testid="admin-note-input"
                          th:text="${app.adminNote}"></textarea>
                <div style="margin-top: 12px; text-align: right;">
                    <button type="submit" class="admin-btn admin-btn--primary"
                            data-testid="btn-save-note">의견 저장</button>
                </div>
            </form>
        </section>
    </div>
</main>

</body>
</html>
