<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 관리 — 청년모아 관리자</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo_symbol.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body class="admin-shell-body">

<div th:replace="~{admin/fragments/header :: header('programs', ${centerScopeLabel}, ${isSystemAdmin})}"></div>

<main class="admin-shell-main">
    <div class="admin-program-page">

        <!-- 헤더 -->
        <section class="admin-program-header">
            <div>
                <h2 class="admin-program-title">프로그램 관리</h2>
                <p class="admin-program-sub">청년 프로그램 목록을 조회하고 등록·편집·삭제할 수 있어요.</p>
            </div>
            <a sec:authorize="hasRole('SYSTEM_ADMIN')"
               th:href="@{/admin/programs/new}"
               class="admin-btn admin-btn--primary">+ 프로그램 등록</a>
        </section>

        <!-- 액션바: 필터 + 검색 -->
        <section class="admin-program-actionbar">
            <form method="get" th:action="@{/admin/programs}" class="admin-program-filters">
                <!-- 검색 인풋: submit 시 filter/page 도 함께 전달 -->
                <input type="hidden" name="status" th:value="${statusFilter}"/>
                <div class="admin-program-search">
                    <input type="text" name="q" th:value="${q}"
                           class="admin-program-search-input"
                           placeholder="프로그램명, 센터 검색"
                           aria-label="프로그램 검색"/>
                    <button type="submit" class="admin-btn admin-btn--sm admin-btn--outline">검색</button>
                </div>
            </form>

            <!-- 필터 세그먼트 (탭) — 클릭 시 q 유지 + status 만 교체 -->
            <nav class="admin-program-tabs" aria-label="상태 필터">
                <a th:href="@{/admin/programs(q=${q})}"
                   th:class="${statusFilter == null or statusFilter == ''} ? 'admin-program-tab admin-program-tab--active' : 'admin-program-tab'">전체</a>
                <a th:href="@{/admin/programs(q=${q}, status='OPEN')}"
                   th:class="${statusFilter == 'OPEN'} ? 'admin-program-tab admin-program-tab--active' : 'admin-program-tab'">모집중</a>
                <a th:href="@{/admin/programs(q=${q}, status='UPCOMING')}"
                   th:class="${statusFilter == 'UPCOMING'} ? 'admin-program-tab admin-program-tab--active' : 'admin-program-tab'">진행예정</a>
                <a th:href="@{/admin/programs(q=${q}, status='ENDED')}"
                   th:class="${statusFilter == 'ENDED'} ? 'admin-program-tab admin-program-tab--active' : 'admin-program-tab'">종료</a>
                <a th:href="@{/admin/programs(q=${q}, status='SUSPENDED')}"
                   th:class="${statusFilter == 'SUSPENDED'} ? 'admin-program-tab admin-program-tab--active' : 'admin-program-tab'">운영중단</a>
            </nav>
        </section>

        <!-- 목록 -->
        <section class="admin-program-list-card">

            <div class="admin-program-row admin-program-row--head">
                <span class="admin-program-col-name">프로그램명</span>
                <span class="admin-program-col-category">카테고리</span>
                <span class="admin-program-col-org">청년센터</span>
                <span class="admin-program-col-status">상태</span>
                <span class="admin-program-col-apply">신청기간</span>
                <span class="admin-program-col-applied">신청현황</span>
                <span class="admin-program-col-views">조회수</span>
                <span class="admin-program-col-created">등록일</span>
                <span class="admin-program-col-actions">관리</span>
            </div>

            <div th:if="${programs.isEmpty()}" class="admin-program-empty">
                <span th:if="${(q != null and !q.isEmpty()) or (statusFilter != null and !statusFilter.isEmpty())}">검색 결과가 없어요.</span>
                <span th:unless="${(q != null and !q.isEmpty()) or (statusFilter != null and !statusFilter.isEmpty())}">등록된 프로그램이 없어요.</span>
            </div>

            <div th:each="p : ${programs.content}" class="admin-program-row">
                <a class="admin-program-col-name admin-program-name-link"
                   th:href="@{/admin/programs/{id}(id=${p.id})}">
                    <span class="admin-program-thumb-wrap">
                        <img th:if="${p.imageUrl != null and !p.imageUrl.isEmpty()}"
                             th:src="${p.imageUrl}" alt=""
                             class="admin-program-thumb"
                             loading="lazy"
                             onerror="this.style.display='none'"/>
                        <span th:unless="${p.imageUrl != null and !p.imageUrl.isEmpty()}"
                              class="admin-program-thumb admin-program-thumb--placeholder" aria-hidden="true">📄</span>
                    </span>
                    <span class="admin-program-name-text" th:text="${p.title}">프로그램명</span>
                </a>
                <span class="admin-program-col-category"
                      th:text="${p.category != null ? p.category : '-'}">-</span>
                <span class="admin-program-col-org" th:text="${p.organization}">청년센터</span>
                <span class="admin-program-col-status">
                    <span class="admin-status-badge"
                          th:classappend="${'admin-status-badge--' + p.status.name().toLowerCase()}"
                          th:text="${p.status.label}">모집중</span>
                </span>
                <span class="admin-program-col-apply"
                      title="신청기간은 A3 에서 별도 컬럼으로 도입돼요.">-</span>
                <span class="admin-program-col-applied"
                      th:text="|${appliedCounts.getOrDefault(p.id, 0)} / ${p.capacity != null ? p.capacity : '∞'}|">0 / 30</span>
                <span class="admin-program-col-views"
                      title="조회수는 A6 통계 트랙에서 도입돼요.">-</span>
                <span class="admin-program-col-created"
                      th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}">2026-09-09</span>
                <div class="admin-program-col-actions">
                    <a th:href="@{/admin/programs/{id}(id=${p.id})}"
                       class="admin-btn admin-btn--sm admin-btn--outline">편집</a>
                </div>
            </div>
        </section>

        <!-- 페이징 -->
        <nav class="admin-notice-paging" th:if="${programs.totalPages > 1}" aria-label="페이지 이동">
            <a class="admin-page-btn"
               th:href="@{/admin/programs(q=${q}, status=${statusFilter}, page=${prevGroupPage})}"
               th:classappend="${hasPrevGroup} ? '' : 'admin-page-btn--disabled'">‹</a>

            <a th:each="p : ${#numbers.sequence(pageGroupStart, pageGroupEnd)}"
               class="admin-page-btn"
               th:classappend="${p == programs.number} ? ' admin-page-btn--active' : ''"
               th:href="@{/admin/programs(q=${q}, status=${statusFilter}, page=${p})}"
               th:text="${p + 1}">1</a>

            <a class="admin-page-btn"
               th:href="@{/admin/programs(q=${q}, status=${statusFilter}, page=${nextGroupPage})}"
               th:classappend="${hasNextGroup} ? '' : 'admin-page-btn--disabled'">›</a>
        </nav>

    </div>
</main>

<script th:inline="javascript">
    (function () {
        var trigger = document.querySelector('.admin-header-user-trigger');
        var menu = document.getElementById('admin-user-dropdown');
        if (!trigger || !menu) return;
        function close() { menu.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
        function open() { menu.hidden = false; trigger.setAttribute('aria-expanded', 'true'); }
        trigger.addEventListener('click', function (ev) {
            ev.stopPropagation();
            if (menu.hidden) open(); else close();
        });
        document.addEventListener('click', function (ev) {
            if (!menu.hidden && !menu.contains(ev.target)) close();
        });
    })();
</script>
</body>
</html>
