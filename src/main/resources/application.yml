spring:
  application:
    name: youth-moa

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/youthmoa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
    prefix: classpath:/templates/
    suffix: .html
    enabled: true

  # 정적 리소스 매핑 = Spring Boot 기본값 (classpath:/static/ → /**)
  # /css/**, /images/**, /webjars/** 등이 SecurityConfig 의 permitAll 매처와 일치하도록 root 매핑 유지.
  # ❌ static-path-pattern: /static/** 로 좁히면 /css/main.css 등이 매핑 안 되어
  #    Security anyRequest().authenticated() 에 걸려 /login 으로 302 redirect 됨.

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    root: INFO
    io.github.sihyuuun.youthmoa: DEBUG
    org.hibernate.SQL: DEBUG
