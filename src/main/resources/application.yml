spring:
  application:
    name: youth-moa

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/youthmoa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 학습 단계 default = update (재기동 시 스키마 유지 + 데이터 누적).
      # signup 등 사용자 상호작용 검증 시 매번 초기화되면 UX 검증 불가하여 update 채택.
      # e2e 프로파일은 자체적으로 create-drop 명시 (application-e2e.properties) → CI 는 영향 없음.
      # 컬럼 삭제·타입 변경 등 파괴적 스키마 변경 시엔 일시적으로 JPA_DDL_AUTO=create-drop 로 override.
      # P0-1 Flyway 활성화 후 이 값은 validate 로 (`JPA_DDL_AUTO=validate`) 최종 전환 예정.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

  flyway:
    # P0-1 준비 (ADMIN-00 §4). V1__baseline.sql 생성 후 enabled=true 로 전환.
    # baseline 은 desc-image 티켓 머지 후 최종 스키마 기준으로 dump 예정.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
    prefix: classpath:/templates/
    suffix: .html
    enabled: true

  # 정적 리소스 매핑 = Spring Boot 기본값 (classpath:/static/ → /**)
  # /css/**, /images/**, /webjars/** 등이 SecurityConfig 의 permitAll 매처와 일치하도록 root 매핑 유지.
  # ❌ static-path-pattern: /static/** 로 좁히면 /css/main.css 등이 매핑 안 되어
  #    Security anyRequest().authenticated() 에 걸려 /login 으로 302 redirect 됨.

server:
  port: 8080
  error:
    include-message: always

# Spring Security remember-me (PersistentToken) 설정
# - key: hash 에 사용되는 서버 secret. 운영 시 반드시 환경변수로 분리.
# - 학습 단계 default 는 dev-only.
security:
  remember-me:
    key: ${REMEMBER_ME_KEY:dev-only-remember-me-key-change-in-prod}

# 앱 커스텀 설정
# youthmoa.kakao.map-app-key — 카카오맵 JavaScript SDK 앱 키.
#   - 미설정(빈 문자열) 이면 CenterController 가 empty 를 전달, 템플릿에서 SDK script 태그를 렌더 안 함.
#   - 이 경우 지도 영역엔 fallback 문구 표시되고 리스트/필터는 정상 동작.
#   - 발급: https://developers.kakao.com → 애플리케이션 → JavaScript 키
youthmoa:
  kakao:
    map-app-key: ${KAKAO_MAP_APP_KEY:}

logging:
  level:
    root: INFO
    io.github.sihyuuun.youthmoa: DEBUG
    org.hibernate.SQL: DEBUG
