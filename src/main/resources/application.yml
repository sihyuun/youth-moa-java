spring:
  application:
    name: youth-moa

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/youthmoa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 2026-07-22 P0-1 Flyway 활성화 후: default = validate.
      # Flyway 가 스키마의 진리 소스. Hibernate 는 엔티티 매핑 ↔ 실제 스키마 일치만 검사.
      # 파괴적 스키마 변경은 새 V<N>__*.sql 파일로 처리 (docs/specs/chore-flyway-activation.md §5 참조).
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    # P0-1 활성화 (2026-07-22). V1__baseline.sql 이 스키마 진리 소스.
    # baseline-version: 1 — 기존 Supabase(테이블 있음) 는 자동 baseline 후 V1 스킵.
    #                       빈 DB (Testcontainers·신규 환경) 는 V1 을 실제 실행.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
    prefix: classpath:/templates/
    suffix: .html
    enabled: true

  # A-admin-notice-attachment (2026-09-03 · Qn-2 A):
  # - max-file-size = 5MB (NoticeService.MAX_ATTACHMENT_SIZE_BYTES 와 일치, Servlet-level rejection 이 우선)
  # - max-request-size = 6MB (파일 5MB + 폼 필드 여유)
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  # 정적 리소스 매핑 = Spring Boot 기본값 (classpath:/static/ → /**)
  # /css/**, /images/**, /webjars/** 등이 SecurityConfig 의 permitAll 매처와 일치하도록 root 매핑 유지.
  # ❌ static-path-pattern: /static/** 로 좁히면 /css/main.css 등이 매핑 안 되어
  #    Security anyRequest().authenticated() 에 걸려 /login 으로 302 redirect 됨.

server:
  port: 8080
  error:
    include-message: always

# chore-observability (2026-07-23): Actuator 별도 포트.
# - 공개 포트 8080 에는 /actuator/** 라우팅 자체가 없음 (별도 포트라 무방비 노출 구조적 차단).
# - Fly 내장 스크레이퍼 및 로컬 Prometheus 는 호스트 내부에서 9091 접근.
# - 노출 엔드포인트: health / prometheus / metrics / info (env·beans·heapdump 등은 미노출 = Actuator 기본).
# - health.show-details=when_authorized: 공개 포트 노출 안 하지만 안전한 기본값 유지.
# - percentiles-histogram: HTTP 요청 시간 히스토그램 노출 (Grafana p95 계산용).
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Spring Security remember-me (PersistentToken) 설정
# - key: hash 에 사용되는 서버 secret. 운영 시 반드시 환경변수로 분리.
# - 학습 단계 default 는 dev-only.
security:
  remember-me:
    key: ${REMEMBER_ME_KEY:dev-only-remember-me-key-change-in-prod}

# 앱 커스텀 설정
# youthmoa.kakao.map-app-key — 카카오맵 JavaScript SDK 앱 키.
#   - 미설정(빈 문자열) 이면 CenterController 가 empty 를 전달, 템플릿에서 SDK script 태그를 렌더 안 함.
#   - 이 경우 지도 영역엔 fallback 문구 표시되고 리스트/필터는 정상 동작.
#   - 발급: https://developers.kakao.com → 애플리케이션 → JavaScript 키
youthmoa:
  kakao:
    map-app-key: ${KAKAO_MAP_APP_KEY:}
  # A-admin-notice-attachment (2026-09-03 · Qn-1 C):
  # - storage.backend=local (기본): ./storage/{bucket}/{path} 로 로컬 저장 (dev/e2e/local/test-guard)
  # - storage.backend=supabase: Supabase Storage REST + OkHttp (prod). @Profile("prod") 로 자동 선택.
  # - SUPABASE_URL 은 기존 재활용. SUPABASE_SERVICE_ROLE_KEY 는 prod secret (배포 세션에서 등록).
  storage:
    backend: ${YOUTHMOA_STORAGE_BACKEND:local}
    local:
      root-dir: ${YOUTHMOA_STORAGE_LOCAL_DIR:./storage}
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      notice-bucket: ${SUPABASE_NOTICE_BUCKET:notice-attachments}
  # F-signup-01: CoolSMS 휴대폰 인증
  # - enabled=false 이면 MockSmsSender 가 활성화되어 실 발송 없이 로그만 남김 (개발/e2e 기본).
  # - mock 모드에서는 항상 mock-fixed-code(=123456) 로 검증되도록 서비스가 코드 생성 대체.
  # - 운영: enabled=true + api-key/api-secret/sender 환경변수 주입.
  coolsms:
    enabled: ${COOLSMS_ENABLED:false}
    api-key: ${COOLSMS_API_KEY:}
    api-secret: ${COOLSMS_API_SECRET:}
    sender: ${COOLSMS_SENDER:}
    code-ttl-seconds: 180
    # per-phone cooldown 제거 (2026-07-16, prototype §5.7 정합). spam 방어는 SmsRateLimiter (IP 기반) 담당.
    max-attempts: 5
    session-valid-minutes: 30
    mock-fixed-code: "123456"

# P0-2 관리자 시드 비밀번호 (DataInitializer.seedAdmins)
# - dev/e2e 기본값 Admin!234, 운영은 반드시 환경변수 주입
admin:
  seed:
    password:
      system: ${ADMIN_SEED_PASSWORD_SYSTEM:Admin!234}
      center1: ${ADMIN_SEED_PASSWORD_CENTER_1:Admin!234}
      center2: ${ADMIN_SEED_PASSWORD_CENTER_2:Admin!234}

logging:
  level:
    root: INFO
    io.github.sihyuuun.youthmoa: DEBUG
    org.hibernate.SQL: DEBUG
