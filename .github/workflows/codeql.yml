name: CodeQL Security Analysis

# CodeQL: GitHub 제공 정적 보안 분석 도구
# Java 소스에서 SQL Injection, XSS, Path Traversal 등 취약점 자동 탐지
# main push + PR + 주 1회 스케줄 실행

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 09:00 KST (00:00 UTC)
    - cron: "0 0 * * 1"

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          # 쿼리 팩: security-extended 는 기본 보안 규칙 + 확장 규칙
          queries: security-extended

      - name: Build (CodeQL 분석용)
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
