name: E2E Playwright

# PR 이 열리거나 main 에 push 될 때 Playwright E2E 실행
# DB: H2 in-memory (application-e2e.properties). 신규 DB 불필요.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Spring Boot (e2e profile)
        run: |
          nohup java -jar build/libs/*.jar \
            --spring.profiles.active=e2e \
            --server.port=8080 \
            > /tmp/boot.log 2>&1 &
          echo $! > /tmp/boot.pid
          # 부팅 대기 — /actuator/health 없으면 index.html
          # HTTP responsive + DataInitializer 완료 두 조건 모두 확인.
          # 2026-08-18 사고: curl / 응답만 성공하면 boot 완료 판정했으나 DataInitializer 는
          # 그 이후에도 실행 중 (seed 유저 커밋 전). 첫 test 의 login 이 seed 없는 상태에서
          # 시도돼 실패하던 이슈. DataInitializer 마지막 로그 "Seeded 2 terms" 도 함께 확인.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/ >/dev/null 2>&1 \
               && grep -q "Seeded 2 terms" /tmp/boot.log 2>/dev/null; then
              echo "Boot + DataInitializer ready in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Boot timeout after 90s"
          tail -80 /tmp/boot.log
          exit 1

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test --project=chromium --reporter=html,line

      # 디자인 계약 검사 — prototype 대비 정량 갭을 리포트한다.
      # 갭이 남아 있는 동안은 의도적으로 실패하므로 **논블로킹**으로 돌린다.
      # 기능 E2E(위 스텝)와 섞으면 "E2E red 방치" 가 되어 신규 회귀를 가린다 (2026-07-13 사고).
      # 화면별 갭이 0 이 되면 그 화면부터 블로킹으로 승격한다.
      - name: Design contract check (non-blocking)
        id: contracts
        continue-on-error: true
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test --project=contracts --reporter=line

      - name: Summarize design contract gaps
        if: always()
        working-directory: e2e
        run: |
          if [ -d gap-reports ]; then
            {
              echo "## 디자인 계약 갭"
              echo ""
              echo "| 화면 | 결과 |"
              echo "|---|---|"
              for f in gap-reports/*.md; do
                screen=$(basename "$f" .md | sed 's/^gap-//')
                total=$(grep -E '^\*\*합계' "$f" | sed 's/\*\*//g' || echo "-")
                echo "| \`$screen\` | ${total:-측정 실패} |"
              done
              echo ""
              echo "> 논블로킹 스텝입니다. 상세는 \`design-contract-gaps\` 아티팩트를 받아 확인하세요."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "갭 리포트가 생성되지 않았습니다 (계약 스펙이 중간에 실패했을 수 있음)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload design contract gap reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-contract-gaps-${{ github.run_number }}
          path: e2e/gap-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop Spring Boot
        if: always()
        run: |
          if [ -f /tmp/boot.pid ]; then
            kill $(cat /tmp/boot.pid) 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Spring Boot log (실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-log-${{ github.run_number }}
          path: /tmp/boot.log
          retention-days: 7
