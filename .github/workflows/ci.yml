name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에서 새 push 가 들어오면 이전 실행 자동 취소 (리소스 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile (main + test sources)
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run JUnit tests (H2 only — Testcontainers 제외)
        run: |
          ./gradlew test \
            --tests JpaMappingTest \
            --tests ProgramSearchTest \
            --tests ProgramServiceTest \
            --tests ApplicationServiceTest \
            --no-daemon

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html
          retention-days: 14

      - name: Upload test report (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # ubuntu 러너는 Docker 내장 → Testcontainers 포함 전체 테스트 실행 가능.
  # 회사 PC/개인 PC 환경 제약과 무관하게 매 PR 에서 실 PostgreSQL 통합 검증 + 커버리지 게이트.
  integration-test:
    name: Integration Test (Testcontainers + Coverage Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run full test suite (H2 + Testcontainers)
        run: ./gradlew test --no-daemon

      - name: Coverage gate (jacocoTestCoverageVerification)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Upload test report (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/test
          retention-days: 7
